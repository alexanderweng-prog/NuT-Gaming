<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Elektromotor und Generator – Lern-App</title>
<style>
@font-face { font-family: 'Fredoka'; src: url('fonts/fredoka.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }
@font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
/* Farbschema "Energie": kräftig, jugendlich, mit gutem Kontrast */
:root {
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;

  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-md: 1.125rem;
  --text-lg: 1.375rem; --text-xl: 1.75rem; --text-2xl: 2.25rem; --text-3xl: 3rem;
  --tracking-wider: 0.12em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-sm: 8px; --radius-md: 16px; --radius-lg: 22px;

  --pop-yellow: #fed835;
  --pop-pink:   #fb55b1;
  --pop-cyan:   #36dcec;
  --pop-green:  #49de78;
  --ink: #161332;
  --st-1: #fc65b6;
  --st-2: #ff8f31;
  --st-3: #edd643;
  --st-4: #4cd676;
  --st-5: #43cae7;
  --st-6: #ae8bff;

  --bg: #f3f4ff;
  --surface: #fdfdff;
  --subtle: #e6e7ff;
  --text: #181535;
  --muted: #4a486d;
  --line: #1f174a;
  --line-soft: #babadd;
  --primary: #6442e4;
  --on-primary: #fbfbff;
  --accent-text: #502cbe;
  --accent-bg: #e3e4ff;
  --good: #005928;   --good-bg: #c1f7d2;
  --bad:  #a90017;    --bad-bg:  #ffdfda;
  --warn: #784000;    --warn-bg: #ffeea0;
  --header-bg: #2f127b;
  --header-text: #fbfbff;
  --header-muted: #ccccf8;
  --header-line: #6358ba;
  --bar-track: #d4d4f5;
  --bar-fill: #745af4;
  --xp: var(--pop-yellow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #120e2d; --surface: #1f1a43; --subtle: #181439;
    --text: #f4f4fd; --muted: #c0c0e4; --line: #9d99ed; --line-soft: #3e3a70;
    --primary: #a89fff; --on-primary: #141030;
    --accent-text: #c9c6ff; --accent-bg: #2d2560;
    --good: #5eee9c; --good-bg: #00361a;
    --bad: #ffa59c;   --bad-bg: #4f1a18;
    --warn: #f6da6f;  --warn-bg: #3e2e00;
    --header-bg: #0a0427;
    --bar-track: #373267; --bar-fill: #aea5ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #120e2d; --surface: #1f1a43; --subtle: #181439;
  --text: #f4f4fd; --muted: #c0c0e4; --line: #9d99ed; --line-soft: #3e3a70;
  --primary: #a89fff; --on-primary: #141030;
  --accent-text: #c9c6ff; --accent-bg: #2d2560;
  --good: #5eee9c; --good-bg: #00361a;
  --bad: #ffa59c;   --bad-bg: #4f1a18;
  --warn: #f6da6f;  --warn-bg: #3e2e00;
  --header-bg: #0a0427;
  --bar-track: #373267; --bar-fill: #aea5ff;
}

/* Basis */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header-bg); }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--font-mono); }
.b { font-weight: 700; }
.small { font-size: var(--text-sm); color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 720px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-7); }
.tag { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--accent-text); }
.tag.inv { color: var(--header-muted); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

/* Kopfbereich */
.top { background: var(--header-bg); color: var(--header-text); padding: var(--space-4) var(--space-4) var(--space-5); border-bottom: 2px solid var(--line); }
.top > * { max-width: 688px; margin-left: auto; margin-right: auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }
.logochip { background: #fff; border-radius: var(--radius-md); padding: 6px 10px; display: flex; }
.logochip img { height: 30px; width: auto; display: block; }
.top h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-3xl); line-height: 1.05; letter-spacing: -0.01em; }
.lead { color: var(--header-muted); font-size: var(--text-md); margin-top: var(--space-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-5); }
.stat { border: 2px solid var(--header-line); border-radius: var(--radius-md); padding: var(--space-3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--header-muted); }
.stat .v { font-weight: 700; font-size: var(--text-md); line-height: 1.15; overflow-wrap: anywhere; }
.stat .s { font-size: var(--text-xs); color: var(--header-muted); }
.xpbar { height: 12px; border-radius: 6px; background: var(--header-line); margin-top: var(--space-4); overflow: hidden; }
.xpbar > div { height: 100%; background: #73ce95; border-radius: 6px; transition: width .3s ease; }
.xpbar.light { background: var(--bar-track); margin: var(--space-3) 0 var(--space-4); }
.xpbar.light > div { background: var(--bar-fill); }

/* Lernpfad */
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: var(--space-4) 0 var(--space-3); }
.row h2, .sumh { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: 1.15; }
.streaknote { margin-top: var(--space-1); }
.path { display: flex; flex-direction: column; gap: var(--space-3); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); }
.st { display: grid; grid-template-columns: 44px 1fr; grid-template-areas: "num body" "act act"; gap: var(--space-3) var(--space-3); align-items: start; }
.st .num { grid-area: num; width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-lg); }
.st .stbody { grid-area: body; min-width: 0; }
.st > .btn, .st > .lock { grid-area: act; }
.st h3, .review h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; }
.sub { font-size: var(--text-sm); color: var(--accent-text); margin-top: 2px; font-weight: 500; }
.mast { display: flex; gap: 4px; margin-top: var(--space-3); }
.seg { height: 8px; flex: 1; border-radius: 3px; background: var(--bar-track); }
.seg.on { background: var(--bar-fill); }
.starsrow { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
.stars { font-size: var(--text-lg); letter-spacing: 3px; color: var(--accent-text); }
.st.locked { border-style: dashed; border-color: var(--line-soft); background: var(--subtle); }
.st.locked .num { background: var(--line-soft); color: var(--muted); }
.st.locked h3 { color: var(--muted); }
.lock { text-align: center; padding: var(--space-2); font-weight: 600; }
.review { display: grid; gap: var(--space-3); background: var(--accent-bg); }
.review p { margin-top: var(--space-1); color: var(--text); }
.foot { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }

/* Buttons */
.btn { appearance: none; min-height: 52px; padding: 0 var(--space-5); border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font: 700 var(--text-md)/1.1 var(--font-body); cursor: pointer; }
@media (hover: hover) { .btn:hover { background: var(--subtle); } }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
@media (hover: hover) { .btn-primary:hover { background: var(--primary); filter: brightness(1.08); } }
.btn.sm { min-height: 40px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.btn.block { display: block; width: 100%; margin-top: var(--space-3); }
.st > .btn { width: 100%; }
.review > .btn { width: 100%; }

/* Runde */
.round { padding-top: var(--space-4); }
.rtop { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.qcard { padding: var(--space-5) var(--space-4); }
.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
.badge { font-size: var(--text-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--radius-sm); background: var(--text); color: var(--bg); }
.badge.warn { background: var(--warn-bg); color: var(--warn); outline: 1px solid var(--warn); }
.q { font-family: var(--font-body); font-weight: 700; font-size: var(--text-lg); line-height: 1.3; margin-bottom: var(--space-5); }
.opts { display: flex; flex-direction: column; gap: var(--space-3); }
.opt { appearance: none; display: flex; align-items: flex-start; gap: var(--space-3); text-align: left; width: 100%; min-height: 56px; padding: var(--space-3) var(--space-4); border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font: 500 var(--text-md)/1.35 var(--font-body); cursor: pointer; }
@media (hover: hover) { .opt:hover:not(:disabled) { background: var(--subtle); } }
.opt .ltr { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-sm); }
.opt:disabled { cursor: default; color: var(--text); opacity: .75; }
.opt.good { opacity: 1; background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.good .ltr { background: var(--good); color: var(--good-bg); border-color: var(--good); }
.opt.bad { opacity: 1; background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt.bad .ltr { background: var(--bad); color: var(--bad-bg); border-color: var(--bad); }
.ansrow { display: flex; align-items: stretch; gap: var(--space-3); margin-bottom: var(--space-2); }
.numin { flex: 1; min-width: 0; min-height: 60px; padding: 0 var(--space-4); border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font-size: var(--text-xl); font-weight: 700; }
.numin:disabled { opacity: .7; }
.unitl { display: flex; align-items: center; min-width: 3.2em; font-size: var(--text-lg); font-weight: 700; color: var(--accent-text); }
.fb { margin-top: var(--space-4); border: 2px solid; border-radius: var(--radius-md); padding: var(--space-4); }
.fb .fbt { font-weight: 700; font-size: var(--text-md); margin-bottom: var(--space-1); }
.fb .fbb { font-size: var(--text-base); line-height: 1.5; }
.fb.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.fb.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.fb .fbb { color: var(--text); }
.fb .fbt { color: inherit; }

/* Formelkarte */
.formulas { margin-bottom: var(--space-4); background: var(--subtle); }
.formulas table { width: 100%; border-collapse: collapse; margin-top: var(--space-2); }
.formulas th, .formulas td { text-align: left; vertical-align: top; padding: var(--space-2) 0; border-top: 1px solid var(--line-soft); font-size: var(--text-sm); }
.formulas th { font-weight: 600; width: 38%; padding-right: var(--space-3); color: var(--muted); }
.formulas td .b { font-size: var(--text-base); }
.formulas td .m { color: var(--muted); font-size: var(--text-sm); }

/* Ergebnis */
.summary .sumh { margin: var(--space-2) 0 var(--space-3); font-size: var(--text-2xl); }
.bigstars { font-size: var(--text-3xl); letter-spacing: 6px; color: var(--accent-text); line-height: 1; margin-bottom: var(--space-3); }
.lead2 { font-size: var(--text-lg); margin-bottom: var(--space-3); }
.gain { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
.gain .b { font-size: var(--text-xl); color: var(--accent-text); }
.summary .fb { margin-top: var(--space-4); }
.miss { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px solid var(--line); }
.miss ul { margin: var(--space-2) 0 0; padding-left: var(--space-5); }
.miss li { margin: 2px 0; }

@media (min-width: 560px) {
  .st { grid-template-columns: 44px 1fr auto; grid-template-areas: "num body act"; align-items: center; }
  .st > .btn, .st > .lock { width: auto; min-width: 130px; }
  .review { grid-template-columns: 1fr auto; align-items: center; }
  .review > .btn { width: auto; min-width: 150px; }
  .top h1 { font-size: 3.5rem; }
}
@media (prefers-reduced-motion: reduce) { .xpbar > div { transition: none; } .btn:active { transform: none; } }

/* ===== Erweiterung: Lernteil, Simulationen, Challenge, Animationen ===== */
.btn:disabled { opacity: .4; cursor: default; }
.xpbar > div { transition: width .9s cubic-bezier(.3,.8,.3,1); }
.xpbar.light > div { transition: width .35s ease; }
.acts { grid-area: act; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.acts .btn { width: 100%; padding: 0 var(--space-3); }

/* Lektion */
.lh { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: 1.2; margin-bottom: var(--space-3); }
.lbody p, .lbody ul { margin: 0 0 12px; }
.lbody ul { padding-left: 22px; }
.lbody li { margin: 4px 0; }
.lcard h3.q { margin-top: 20px; }
.dots { display: flex; gap: 6px; margin: 12px 0; }
.dot { flex: 1; height: 8px; border-radius: 4px; background: var(--bar-track); transition: background .3s; }
.dot.on { background: var(--bar-fill); }
.navrow { display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-3); margin-top: var(--space-4); }
.simhost { margin-top: var(--space-2); }
.merk { display: flex; gap: var(--space-3); align-items: flex-start; border: 2px solid var(--primary); background: var(--accent-bg); border-radius: var(--radius-md); padding: var(--space-3); margin: var(--space-3) 0; color: var(--text); }
.mk { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-sm); }
.merk.warn { border-color: var(--warn); background: var(--warn-bg); }
.merk.warn .mk { background: var(--warn); color: var(--warn-bg); }
.tri { width: 190px; margin: 12px auto; text-align: center; font-size: var(--text-xl); font-weight: 700; }
.tri-top { border: 2px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; padding: 8px; background: var(--accent-bg); }
.tri-row { display: grid; grid-template-columns: 1fr 1fr; }
.tri-row > div { border: 2px solid var(--line); padding: 8px; }
.tri-row > div:first-child { border-radius: 0 0 0 8px; border-right-width: 1px; }
.tri-row > div:last-child { border-radius: 0 0 8px 0; border-left-width: 1px; }
.plate { border: 3px double var(--line); border-radius: 6px; padding: 12px; text-align: center; margin: 8px 0 16px; background: var(--subtle); line-height: 1.8; }

/* Simulationen */
.sim { border: 2px solid var(--line-soft); border-radius: var(--radius-md); padding: var(--space-3); background: var(--subtle); }
.sl { display: block; margin-top: var(--space-3); }
.sll { display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: 2px; }
input[type=range] { width: 100%; height: 36px; margin: 0; accent-color: var(--primary); }
.readout { font-size: var(--text-sm); line-height: 1.7; background: var(--surface); border: 2px solid var(--line-soft); border-radius: var(--radius-md); padding: var(--space-3); margin-top: var(--space-3); }
.readout.mono, p.readout.mono { font-family: var(--font-mono); }
.hubvis { display: flex; gap: var(--space-4); align-items: flex-end; }
.hubvis .readout { flex: 1; margin-top: 0; min-width: 0; }
.rail { position: relative; width: 110px; height: 190px; flex: none; border-left: 3px solid var(--line); border-bottom: 3px solid var(--line); }
.rl { position: absolute; left: 8px; font-size: var(--text-xs); color: var(--muted); }
.rl.top { top: 0; } .rl.bot { bottom: 0; }
.wtbox { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: 0; height: 34px; border-radius: 6px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: transform .7s cubic-bezier(.3,.8,.3,1), width .3s; }
.seg3 { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
.seg3 .btn.on, .chips .btn.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.brow { display: grid; grid-template-columns: 4.5rem 1fr 4.8rem; gap: var(--space-2); align-items: center; margin: var(--space-2) 0; }
.bname { font-size: var(--text-sm); font-weight: 600; }
.btrack { display: block; height: 16px; background: var(--bar-track); border-radius: 8px; overflow: hidden; }
.bfill { display: block; height: 100%; background: var(--bar-fill); border-radius: 8px; transition: width .6s cubic-bezier(.3,.8,.3,1); }
.bval { font-size: var(--text-xs); text-align: right; }
.lanes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.lane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.trk { position: relative; height: 150px; border: 2px solid var(--line-soft); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.trk i { display: block; position: absolute; left: 0; right: 0; height: 2px; background: var(--line-soft); }
.trk i:nth-child(1) { bottom: 28px; } .trk i:nth-child(2) { bottom: 56px; } .trk i:nth-child(3) { bottom: 84px; } .trk i:nth-child(4) { bottom: 112px; } .trk i:nth-child(5) { bottom: 140px; }
.run { position: absolute; left: 50%; bottom: 4px; width: 22px; height: 22px; margin-left: -11px; border-radius: 6px; background: var(--primary); }
.lname { font-weight: 700; }
.lpl { min-height: 2.7em; }
.srow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "n v" "t t"; gap: 6px var(--space-2); align-items: center; width: 100%; padding: 10px 12px; margin: 6px 0; border: 2px solid var(--line-soft); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.srow .bname { grid-area: n; } .srow .bval { grid-area: v; } .srow .btrack { grid-area: t; }
.srow.on { border-color: var(--line); }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
.trio > div { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.trio .k { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--muted); }
.trio b { font-size: var(--text-md); overflow-wrap: anywhere; }
.puivis { display: flex; gap: var(--space-4); align-items: flex-end; }
.areabox { position: relative; width: 170px; height: 170px; flex: none; border-left: 3px solid var(--line); border-bottom: 3px solid var(--line); }
.area { position: absolute; left: 0; bottom: 0; width: 0; height: 0; background: var(--accent-bg); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; color: var(--accent-text); font-weight: 700; transition: width .4s ease, height .4s ease; overflow: hidden; }
.lampwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lamp { width: 64px; height: 64px; border-radius: 50%; background: #ffdc4c; border: 3px solid var(--line); transition: opacity .4s; }
.meterbox { display: flex; align-items: baseline; gap: var(--space-2); background: var(--header-bg); color: var(--header-text); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); }
.mdisp { font-size: var(--text-2xl); font-weight: 700; letter-spacing: .04em; }
.mu { color: var(--header-muted); }
.mcost { margin: var(--space-2) 0 0; }
.verdict { font-weight: 700; margin-top: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--accent-bg); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
.stack { display: flex; height: 40px; border-radius: var(--radius-md); overflow: hidden; border: 2px solid var(--line); background: var(--surface); }
.sn { background: var(--bar-fill); transition: width .6s cubic-bezier(.3,.8,.3,1); }
.sw { background: var(--line-soft); transition: width .6s cubic-bezier(.3,.8,.3,1); }
.stlab { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-sm); margin: var(--space-2) 0; }

/* Challenge */
.chal { background: var(--subtle); }
.chal h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; margin: 4px 0 6px; }
.chrow { margin-top: var(--space-3); }
.chrow .numin { font-size: var(--text-lg); min-height: 52px; text-transform: uppercase; }
.errtxt { color: var(--bad); font-weight: 600; font-size: var(--text-sm); margin-top: 4px; }
.chlist { margin: var(--space-3) 0 0; padding-left: 20px; font-size: var(--text-sm); }
.nickrow { margin-top: var(--space-3); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.resline { border: 2px dashed var(--line); border-radius: var(--radius-md); padding: var(--space-3); margin: var(--space-3) 0 var(--space-2); font-size: var(--text-sm); overflow-wrap: anywhere; user-select: all; }

/* Animationen */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.94); } 60% { transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes starin { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { opacity: 1; transform: none; } }
@keyframes fly { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
.view.enter { animation: rise .35s both; }
.view.enter .path > * { animation: rise .45s both; animation-delay: calc(var(--i, 0) * 70ms); }
.lcard.fromR { animation: slideR .35s both; }
.lcard.fromL { animation: slideL .35s both; }
.fb { animation: pop .3s both; }
.opt.bad { animation: shake .45s; }
.opt.good { animation: pulse .5s; }
.numin.err { border-color: var(--bad); animation: shake .45s; }
.bigstars span { display: inline-block; color: var(--line-soft); animation: starin .5s var(--d, 0ms) both; }
.bigstars span.on { color: var(--accent-text); }
.summary .card { position: relative; overflow: hidden; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; left: 50%; top: 30%; width: 9px; height: 14px; border-radius: 2px; animation: fly 1.3s ease-out both; }
.view.noanim *, .view.noanim { animation: none !important; }
@media (min-width: 560px) {
  .acts { grid-template-columns: auto auto; }
  .acts .btn { min-width: 110px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Klassenwertung */
.clsc { background: var(--subtle); }
.clsc h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; margin: 4px 0 8px; }
.clsc p { margin-top: 6px; }
.board { list-style: none; margin: var(--space-2) 0; padding: 0; }
.board li { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: var(--space-2); align-items: center; padding: 10px 12px; border: 2px solid var(--line-soft); border-radius: var(--radius-md); margin: 6px 0; background: var(--surface); font-size: var(--text-base); }
.board li.me { border-color: var(--line); background: var(--accent-bg); font-weight: 700; }
.board li.gap { display: block; text-align: center; border: none; background: none; padding: 0; color: var(--muted); }
.board .rk { font-weight: 700; color: var(--accent-text); }
.board .nm { min-width: 0; overflow-wrap: anywhere; }
.goal { margin-top: var(--space-3); }
.btnrow { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.chboard { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px solid var(--line); }

/* ===================== Jugendlicher Look ===================== */
body { font-weight: 500; }
h1, h2, h3, .top h1, .row h2, .sumh, .lh, .st h3, .review h3, .clsc h3, .chal h3 { font-family: var(--font-display); letter-spacing: 0; }
.q { font-family: var(--font-body); font-weight: 800; }
.xpbar { height: 16px; border-radius: 8px; }
.top .xpbar { border: 3px solid var(--header-line); background: #150a3c; }
.xpbar > div, .top .xpbar > div { background: var(--xp); }
.xpbar.light { height: 14px; border: 3px solid var(--line); background: var(--bar-track); }
.xpbar.light > div { background: var(--sc, var(--bar-fill)); }
.xpbar > div { position: relative; overflow: hidden; border-radius: 6px; }
.xpbar > div::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); transform: translateX(-100%); animation: shine 2.4s ease-in-out infinite; }
@keyframes shine { to { transform: translateX(100%); } }

/* Karten und Knöpfe im Sticker-Stil */
.card { border-width: 3px; border-radius: var(--radius-md); box-shadow: 0 5px 0 var(--line); }
.btn { border-width: 3px; border-radius: 14px; box-shadow: 0 4px 0 var(--line); font-weight: 800; transition: transform .08s ease, box-shadow .08s ease, filter .15s; }
@media (hover: hover) { .btn:hover { filter: brightness(1.06); } }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.sm { box-shadow: 0 3px 0 var(--line); }
.btn:disabled { box-shadow: none; transform: none; }
.btn-primary { border-color: var(--line); }
.btn.nudge { animation: nudge 1.7s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { box-shadow: 0 4px 0 var(--line), 0 0 0 0 var(--pop-yellow); } 50% { box-shadow: 0 4px 0 var(--line), 0 0 0 9px rgba(254,216,53,0); } }
.seg3 .btn.on, .chips .btn.on { border-color: var(--line); }
.tag { color: var(--accent-text); }
.tag.inv { color: var(--header-muted); }

/* Kopfbereich */
.top { position: relative; overflow: hidden; border-bottom: 4px solid var(--line);
  background: radial-gradient(circle at 88% 18%, rgba(165,0,145,.55), transparent 42%), radial-gradient(circle at 6% 92%, rgba(0,131,199,.5), transparent 46%), var(--header-bg); }
.top > * { position: relative; z-index: 1; }
.top > .spark { position: absolute; z-index: 0; max-width: none; margin: 0; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); opacity: .55; animation: drift var(--t) ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(22px, -26px) scale(1.35); } }
.hero { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.herotxt { min-width: 0; }
.top h1 { font-weight: 700; font-size: 3.2rem; line-height: 1; text-shadow: 0 3px 0 #150640; }
.stat { border: 3px solid var(--header-line); border-radius: 14px; background: rgba(255,255,255,.08); }
.stat:nth-child(2) .v { color: var(--pop-yellow); }
.stat .v { font-family: var(--font-display); font-weight: 600; }
.stat .v.mono { font-family: var(--font-mono); font-weight: 700; }
.logochip { border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.bubble { display: none; margin-top: var(--space-2); background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: var(--text-sm); }
.bubble.show { display: inline-block; animation: pop .35s both; }
.wbtn { appearance: none; background: none; border: 0; padding: 4px; cursor: pointer; flex: none; }

/* Stationen */
.st .num { width: 50px; height: 50px; border-radius: 14px; background: var(--sc); color: var(--ink); border: 3px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: var(--text-xl); box-shadow: 0 3px 0 var(--line); }
.st { grid-template-columns: 50px 1fr; }
.seg { height: 10px; border-radius: 5px; }
.seg.on { background: var(--sc, var(--bar-fill)); }
.sub { color: var(--accent-text); font-weight: 700; }
.stars { font-size: var(--text-xl); color: var(--pop-yellow); -webkit-text-stroke: 1.5px var(--line); letter-spacing: 2px; }
.st.locked { box-shadow: none; }
.st.locked .num { background: var(--line-soft); box-shadow: none; }
.review { background: var(--accent-bg); }
.intro { background: var(--pop-yellow); color: var(--ink); margin-bottom: var(--space-4); }
.intro .tag { color: var(--ink); }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin: var(--space-3) 0; }
.step3 { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: var(--surface); color: var(--text); border: 3px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.step3 b { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
.step3 span { font-family: var(--font-display); font-weight: 600; font-size: var(--text-md); }
.step3 small { font-size: var(--text-xs); color: var(--muted); line-height: 1.25; }
.intro .btn { color: var(--text); }

/* Aufgaben und Lektionen */
.qcard { border-top: 12px solid var(--sc, var(--primary)); }
.round .qcard { margin-top: 38px; }
.opt { border-width: 3px; border-radius: 14px; box-shadow: 0 4px 0 var(--line-soft); transition: transform .1s, box-shadow .1s, background .15s; }
@media (hover: hover) { .opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--line-soft); } }
.opt .ltr { background: var(--sc, var(--primary)); color: var(--ink); border: 3px solid var(--line); }
.opt.good, .opt.bad { box-shadow: 0 4px 0 currentColor; }
.opt.good .ltr { background: var(--good); color: var(--good-bg); }
.opt.bad .ltr { background: var(--bad); color: var(--bad-bg); }
.numin { border-width: 3px; border-radius: 14px; }
.fb { border-width: 3px; border-radius: 14px; position: relative; }
.fbx { margin-top: var(--space-3); }
.dot { height: 10px; border-radius: 5px; }
.dot.on { background: var(--sc, var(--bar-fill)); }
.merk { border-width: 3px; border-radius: 14px; }
.mk { background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); }
.merk.warn .mk { background: var(--pop-pink); color: var(--ink); }
.goals { background: var(--accent-bg); border: 3px solid var(--line); border-radius: 14px; padding: var(--space-3); margin-bottom: var(--space-3); }
.goals ul { margin: var(--space-1) 0 0; padding-left: 20px; }
.worked { border: 3px solid var(--line); border-radius: 14px; background: var(--subtle); padding: var(--space-3); margin: var(--space-3) 0; }
.wgiven { font-weight: 800; margin-bottom: var(--space-2); }
.wsteps { list-style: none; margin: 0 0 var(--space-3); padding: 0; counter-reset: w; }
.wsteps li { counter-increment: w; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 2px dashed var(--line-soft); max-height: 240px; overflow: hidden; transition: opacity .45s ease, max-height .55s ease, transform .45s ease, padding .45s ease; }
.wsteps li::before { content: counter(w); width: 30px; height: 30px; border-radius: 50%; background: var(--sc, var(--primary)); color: var(--ink); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.wsteps li.hid { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; transform: translateY(12px); border-color: transparent; }
.wt { font-weight: 800; }
.wm { font-size: var(--text-sm); margin-top: 2px; overflow-wrap: anywhere; }
.bfill, .sn { background: var(--sc, var(--bar-fill)); }
.run, .wt2 { background: var(--sc, var(--primary)); }
.wt { color: inherit; }
.sim .wtbox, .rail .wtbox { background: var(--sc, var(--primary)); color: var(--ink); border: 3px solid var(--line); }
.sim { border-width: 3px; border-radius: 14px; }
.readout { border-width: 3px; }
.xppop { position: absolute; right: 14px; top: -18px; background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); border-radius: 999px; padding: 2px 12px; font-family: var(--font-display); font-weight: 700; animation: xpfloat 1.3s ease-out both; }
@keyframes xpfloat { 0% { opacity: 0; transform: translateY(18px) scale(.5); } 30% { opacity: 1; transform: translateY(-8px) scale(1.15); } 100% { opacity: 1; transform: translateY(-4px) scale(1); } }
.bigstars span.on { color: var(--pop-yellow); -webkit-text-stroke: 2px var(--line); }
.bigstars span { -webkit-text-stroke: 2px var(--line-soft); }
.sumw { position: absolute; right: 12px; top: 8px; }
.summary .card { padding-right: 96px; }
.board li.me { background: var(--pop-yellow); color: var(--ink); }
.board li.me .rk { color: var(--ink); }
.view.enter .qcard { animation: bounceIn .55s both; }
.view.enter .opts .opt { animation: rise .4s both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
@keyframes bounceIn { 0% { opacity: 0; transform: translateY(26px) scale(.96); } 60% { opacity: 1; transform: translateY(-5px) scale(1.01); } 100% { opacity: 1; transform: none; } }

/* Maskottchen Watti: eine kleine Batterie, die sich mit deinen Punkten füllt */
.watti { --w: 64px; position: relative; width: var(--w); display: flex; flex-direction: column; align-items: center; transform-origin: 50% 100%; animation: idle 3.4s ease-in-out infinite; }
.watti.big { --w: 78px; }
.watti.mini { --w: 46px; position: absolute; right: 16px; top: calc(var(--w) * -1.42); }
.watti .cap { width: calc(var(--w) * .34); height: calc(var(--w) * .11); background: var(--line); border-radius: 4px 4px 0 0; }
.watti .body { position: relative; width: var(--w); height: calc(var(--w) * 1.3); border: 3px solid var(--line); border-radius: calc(var(--w) * .26); background: #f3f4ff; overflow: hidden; box-shadow: 0 4px 0 var(--line); }
.watti .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--lvl); background: var(--pop-yellow); transition: height 1s cubic-bezier(.3, .8, .3, 1); }
.watti .fill::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 3px; background: rgba(31,23,74,.35); }
.watti .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--w) * .1); }
.watti .eyes { display: flex; gap: calc(var(--w) * .2); }
.watti .eye { display: block; width: calc(var(--w) * .13); height: calc(var(--w) * .19); background: var(--ink); border-radius: 50%; animation: blink 4.6s infinite; }
.watti .mouth { display: block; width: calc(var(--w) * .3); height: calc(var(--w) * .14); border: 3px solid var(--ink); border-top: none; border-radius: 0 0 calc(var(--w) * .3) calc(var(--w) * .3); }
.watti[data-mood="cheer"] .mouth { height: calc(var(--w) * .2); background: var(--ink); }
.watti[data-mood="sad"] .mouth { border: 3px solid var(--ink); border-bottom: none; border-radius: calc(var(--w) * .3) calc(var(--w) * .3) 0 0; margin-top: calc(var(--w) * .06); }
.watti[data-mood="think"] .mouth { border: 0; border-bottom: 3px solid var(--ink); border-radius: 0; width: calc(var(--w) * .2); height: 0; }
.watti[data-mood="cheer"] { animation: hop .65s ease-out 2; }
.watti[data-mood="sad"] { animation: wobble .7s ease-in-out; }
.watti.hop { animation: hop .65s ease-out; }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-24px) scale(.94, 1.1); } 62% { transform: translateY(0) scale(1.1, .9); } 100% { transform: none; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
@media (max-width: 380px) { .top h1 { font-size: 2.6rem; } .watti.big { --w: 64px; } }

/* QR-Lernstand und Prüf-App */
.txtin { font-family: var(--font-body); font-weight: 700; font-size: var(--text-md); text-transform: none; }
.qrbox { background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 10px; margin: var(--space-3) auto; max-width: 340px; }
.qrbox svg { display: block; width: 100%; height: auto; }
.qrscreen .card { padding-right: var(--space-4); }
.countdown { text-align: center; font-weight: 800; margin: var(--space-2) 0 var(--space-3); }
.qrc { background: var(--subtle); }
.qrc h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); margin: 4px 0 6px; }
.tpage .card { margin-bottom: var(--space-4); }
.thead { margin-bottom: var(--space-4); }
.thead h1 { font-family: var(--font-display); font-size: var(--text-2xl); margin: 4px 0 6px; }
.tpage h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); margin: 4px 0 8px; }
.cam { width: 100%; max-height: 340px; border: 3px solid var(--line); border-radius: 14px; background: #000; object-fit: cover; margin-bottom: var(--space-3); }
.det { margin-top: var(--space-3); }
.det summary { cursor: pointer; font-weight: 800; padding: 6px 0; }
.manual { width: 100%; border: 3px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); padding: 10px; font-size: var(--text-sm); }
.rhead { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.rbadge { font-weight: 800; padding: 4px 14px; border: 3px solid var(--line); border-radius: 999px; background: var(--subtle); }
.rbadge.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.rbadge.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.rbadge.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.flags { margin: var(--space-3) 0 0; padding-left: 20px; }
.flags li { margin: 4px 0; font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-top: 2px solid var(--line-soft); vertical-align: top; }
.tbl thead th { border-top: none; font-size: var(--text-xs); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--muted); }
.rtbl th { width: 42%; color: var(--muted); font-weight: 700; }
.tscroll { overflow-x: auto; }
.tg { color: var(--good); font-weight: 800; } .tw { color: var(--warn); font-weight: 800; }
#resultcard.flash { animation: pop .4s both; }

/* Motor-Simulationen */
@keyframes spin { to { transform: rotate(360deg); } }
.chk { display: flex; align-items: center; gap: 8px; margin-top: var(--space-3); font-weight: 800; }
.chk input { width: 22px; height: 22px; accent-color: var(--primary); }
.magvis { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: var(--space-3); }
.nail { position: relative; width: 210px; height: 50px; }
.core { position: absolute; left: 6px; right: 6px; top: 15px; height: 20px; border-radius: 10px; background: var(--muted); border: 3px solid var(--line); transition: opacity .3s; }
.coil { position: absolute; left: 34px; right: 34px; top: 3px; height: 44px; border: 3px solid var(--line); border-radius: 8px; background: linear-gradient(90deg, var(--sc, var(--primary)) 0 4px, transparent 4px) 0 0 / calc(100% / var(--turns, 4)) 100%; transition: background-size .3s; }
.clips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 230px; min-height: 28px; }
.clip { display: block; width: 12px; height: 22px; border: 3px solid var(--line-soft); border-radius: 6px; opacity: .3; transform: translateY(-10px); transition: opacity .25s, transform .35s; }
.clip.on { opacity: 1; border-color: var(--line); transform: none; }
.motorvis { display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-3); }
.pole { width: 54px; height: 100px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: var(--text-lg); border: 3px solid var(--line); color: var(--ink); }
.pole.n { background: var(--pop-pink); border-radius: 14px 0 0 14px; }
.pole.s { background: var(--pop-cyan); border-radius: 0 14px 14px 0; }
.rotorbox { position: relative; width: 120px; height: 100px; border-top: 3px solid var(--line); border-bottom: 3px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.rotor { width: 90px; height: 22px; border-radius: 11px; background: var(--sc, var(--primary)); border: 3px solid var(--line); animation: spin 1.2s linear infinite; }
.axis { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.genvis { display: flex; align-items: center; justify-content: space-around; margin-bottom: var(--space-3); }
.crank { position: relative; width: 100px; height: 100px; border: 3px solid var(--line); border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.crankarm { width: 76px; height: 14px; border-radius: 7px; background: var(--sc, var(--primary)); border: 3px solid var(--line); animation: spin 1s linear infinite; }
.battvis { display: flex; flex-direction: column-reverse; align-items: center; margin-bottom: var(--space-3); }
.batt { width: 76px; height: 110px; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); display: flex; align-items: flex-end; }
.battfill { width: 100%; height: 0; background: var(--sc, var(--primary)); transition: height .8s cubic-bezier(.3, .8, .3, 1); }
.battcap { width: 28px; height: 9px; background: var(--line); border-radius: 4px 4px 0 0; }
.gearvis { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: var(--space-3); min-height: 180px; }
.gearbox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 90px; }
.gear { border-radius: 50%; border: 3px solid var(--line); background: repeating-conic-gradient(var(--sc, var(--primary)) 0 10deg, var(--surface) 10deg 20deg); animation: spin 8s linear infinite; transition: width .3s, height .3s; }
.gear.g2 { animation-direction: reverse; background: repeating-conic-gradient(var(--st-5) 0 10deg, var(--surface) 10deg 20deg); }
.gl { font-size: var(--text-xs); font-weight: 800; }

/* Lernlandkarte */
.hubmain > .small { margin-bottom: var(--space-3); }
.hubmain .chips { margin-bottom: var(--space-4); }
.top .stack { margin-top: var(--space-4); border-color: var(--header-line); background: #150a3c; height: 18px; }
.sg { background: var(--pop-green); transition: width .6s cubic-bezier(.3,.8,.3,1); }
.sy { background: var(--pop-yellow); transition: width .6s cubic-bezier(.3,.8,.3,1); }
.sred { background: var(--pop-pink); transition: width .6s cubic-bezier(.3,.8,.3,1); }
.bk { padding: 0; border-top: 12px solid var(--sc); position: relative; overflow: hidden; }
.bk[hidden], .kp[hidden] { display: none !important; }
.bk > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 46px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.bk > summary::-webkit-details-marker { display: none; }
.bk > summary::after { content: none; }
.bnum { width: 46px; height: 46px; border-radius: 14px; background: var(--sc); color: var(--ink); border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: var(--text-xl); }
.btxt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.btitle { font-family: var(--font-display); font-weight: 600; font-size: var(--text-md); line-height: 1.2; }
.bcount { font-weight: 700; font-size: var(--text-sm); }
.bsegs { display: flex; gap: 4px; margin-top: 2px; }
.bsegs i { display: block; height: 9px; flex: 1; max-width: 46px; border-radius: 5px; background: var(--bar-track); }
.bsegs i.g { background: var(--pop-green); } .bsegs i.y { background: var(--pop-yellow); } .bsegs i.r { background: var(--pop-pink); }
.bk[open] > summary { border-bottom: 3px solid var(--line); }
.kplist { list-style: none; margin: 0; padding: 0; }
.kp { padding: var(--space-4); border-top: 2px dashed var(--line-soft); }
.kp:first-child { border-top: none; }
.kptop { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); }
.kcode { font-weight: 800; background: var(--sc); color: var(--ink); border: 3px solid var(--line); border-radius: 8px; padding: 1px 8px; font-size: var(--text-sm); }
.ktags { display: flex; flex-wrap: wrap; gap: 6px; }
.ktag { font-size: var(--text-xs); font-weight: 700; color: var(--muted); border: 2px solid var(--line-soft); border-radius: 999px; padding: 1px 8px; }
.ktext { font-weight: 700; font-size: var(--text-md); line-height: 1.35; margin: 0 0 var(--space-2); }
.kapps { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
.appchip { font-size: var(--text-sm); font-weight: 800; color: var(--text); background: var(--accent-bg); border: 3px solid var(--line); border-radius: 999px; padding: 4px 12px; text-decoration: none; box-shadow: 0 3px 0 var(--line); }
@media (hover: hover) { a.appchip:hover { filter: brightness(1.06); } }
.appchip.plan { background: var(--subtle); border-style: dashed; box-shadow: none; font-weight: 700; color: var(--muted); }
.amps { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.amp { appearance: none; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 6px; border: 3px solid var(--line-soft); border-radius: 14px; background: var(--surface); color: var(--text); font: 800 var(--text-sm)/1.1 var(--font-body); cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
@media (hover: hover) { .amp:hover { border-color: var(--line); } }
.amp:active { transform: translateY(2px); }
.dotc { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); flex: none; }
.amp.r .dotc { background: var(--pop-pink); } .amp.y .dotc { background: var(--pop-yellow); } .amp.g .dotc { background: var(--pop-green); }
.amp[aria-pressed="true"] { border-color: var(--line); box-shadow: 0 3px 0 var(--line); font-weight: 900; }
.amp.r[aria-pressed="true"] { background: var(--bad-bg); } .amp.y[aria-pressed="true"] { background: var(--warn-bg); } .amp.g[aria-pressed="true"] { background: var(--good-bg); }
.lp { margin-top: var(--space-2); }
.lp summary { cursor: pointer; font-size: var(--text-sm); font-weight: 700; color: var(--muted); }
.lp p { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--muted); }
.chips .btn.on { background: var(--primary); color: var(--on-primary); }
@media (max-width: 380px) { .amp { font-size: var(--text-xs); } .dotc { display: none; } }

/* Bewegungen: Diagramme, Tabellen, Wagen */
.chart { width: 100%; max-width: 440px; height: auto; display: block; margin: var(--space-2) auto var(--space-3); }
.chart .gr { stroke: var(--line-soft); stroke-width: 1; }
.chart .ax { stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; }
.chart .tk { fill: var(--muted); font: 700 11px var(--font-body); }
.chart .lb { fill: var(--text); font: 800 12px var(--font-body); }
.chart .cv { fill: none; stroke: var(--sc, var(--primary)); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln2 { stroke: var(--pop-pink); }
.chart .pt { fill: var(--pop-yellow); stroke: var(--line); stroke-width: 2.5; }
.chart .fit { stroke: var(--text); stroke-width: 2.5; stroke-dasharray: 7 5; }
.chart .mk { fill: var(--pop-yellow); stroke: var(--line); stroke-width: 3; }
.opt svg.mini { display: block; width: 100%; max-width: 160px; height: auto; }
.mini .ax { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
.mini .cv { fill: none; stroke: var(--sc, var(--primary)); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.opt:has(svg.mini) { justify-content: flex-start; align-items: center; }
.dtab { border-collapse: collapse; margin: 0 0 var(--space-3); font-size: var(--text-base); max-width: 100%; }
.dtab th, .dtab td { border: 2px solid var(--line); padding: 4px 10px; text-align: center; font-weight: 700; }
.dtab th { background: var(--accent-bg); text-align: left; font-size: var(--text-sm); }
.track { position: relative; height: 54px; margin: var(--space-4) 44px var(--space-5) 6px; border-bottom: 4px solid var(--line); }
.car { position: absolute; bottom: 4px; left: 0; width: 36px; height: 22px; margin-left: -4px; background: var(--sc, var(--primary)); border: 3px solid var(--line); border-radius: 8px; }
.car.runner { border-radius: 50% 50% 8px 8px; width: 26px; height: 30px; }
.marks { position: absolute; left: 0; right: 0; bottom: -4px; height: 0; }
.marks i { position: absolute; bottom: -22px; width: 22px; margin-left: -11px; text-align: center; font: 800 11px var(--font-mono); font-style: normal; color: var(--text); }
.marks i::before { content: ""; position: absolute; left: 50%; top: -14px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--pop-yellow); border: 2px solid var(--line); }
.lg { display: inline-block; min-width: 24px; text-align: center; font-weight: 800; border: 2px solid var(--line); border-radius: 6px; color: var(--ink); }
.lg.a { background: var(--primary); color: var(--on-primary); } .lg.b { background: var(--pop-pink); }

/* 7_1 Naturwissenschaften: Sortierspiel, Draht, Mikroskop, Zellen */
.top h1.long { font-size: 2.3rem; line-height: 1.08; overflow-wrap: anywhere; }
.gcard { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.25; margin: 0 0 var(--space-3); }
.gbtns { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
.gbtns .btn.on { background: var(--primary); color: var(--on-primary); }
.wirevis { display: flex; align-items: center; gap: 6px; margin: var(--space-3) 0; }
.batt2 { flex: none; width: 44px; height: 30px; border: 3px solid var(--line); border-radius: 6px; background: var(--pop-yellow); }
.wire { height: 12px; border: 2px solid var(--line); border-radius: 6px; transition: width .35s ease, background .35s ease; max-width: 100%; }
.field { width: 100%; max-width: 250px; aspect-ratio: 1; margin: var(--space-3) auto; border: 4px solid var(--line); border-radius: 50%; overflow: hidden; background: var(--surface); }
.cells { width: 100%; height: 100%; background-color: var(--accent-bg); background-image: linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px); background-size: var(--cs, 20px) var(--cs, 20px); background-position: center; transition: background-size .45s ease; }
.cellbox { position: relative; width: 100%; max-width: 300px; height: 170px; margin: var(--space-3) auto; border: 4px solid var(--line); border-radius: 8px; background: var(--accent-bg); }
.cellbox.onion { background: var(--surface); display: flex; align-items: center; justify-content: center; }
.cdots { position: absolute; inset: 14px; }
.cdots i { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--pop-green); border: 3px solid var(--line); }
.proto { background: var(--pop-pink); border: 3px solid var(--line); border-radius: 14px; transition: width .7s ease, height .7s ease; }
.gbtns .btn.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.gbtns .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.sim > .btn.block { margin-top: var(--space-3); }

/* Touch: schnelle, zuverlässige Tipps */
button, a, [data-act], input, label, summary { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* Versteckte Elemente bleiben versteckt, auch wenn ihr Stil eine Anzeige vorgibt */
[hidden] { display: none !important; }

/* Titel und Maskottchen: nichts überlappt, nichts fängt Tipps ab */
.top h1 { font-size: clamp(1.9rem, 8vw, 3.2rem); overflow-wrap: anywhere; }
.top h1.long { font-size: clamp(1.6rem, 6.6vw, 2.3rem); }
.herotxt { flex: 1; min-width: 0; }
.watti.mini, .sumw { pointer-events: none; }
.round .qcard { margin-top: 58px; }

/* 7_5 Energie: Würfel, Ketten, Wärmetransport */
.cubes { display: flex; gap: 6px; flex-wrap: wrap; margin: var(--space-3) 0; }
.cube { display: block; width: 30px; height: 30px; border: 3px solid var(--line); border-radius: 7px; transition: background .45s ease; }
.cube.lage { background: var(--st-5); } .cube.bew { background: var(--pop-yellow); } .cube.therm { background: var(--pop-pink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-2); }
.lgd { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-radius: 4px; }
.lgd.lage { background: var(--st-5); } .lgd.bew { background: var(--pop-yellow); } .lgd.therm { background: var(--pop-pink); }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: var(--space-3) 0; }
.cbox { border: 3px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--accent-bg); font-weight: 800; font-size: var(--text-sm); max-width: 120px; text-align: center; }
.cbox.w { background: var(--pop-yellow); color: var(--ink); }
.carrow { font-size: 1.4rem; font-weight: 800; }
.cend { flex: 1; min-width: 150px; }
.bfill.th { background: var(--pop-pink); }
.wdemo { display: flex; align-items: center; gap: 8px; height: 120px; margin: var(--space-3) 0; }
.hot, .cold { flex: none; width: 54px; height: 96px; border: 3px solid var(--line); border-radius: 12px; }
.hot { background: var(--pop-pink); } .cold { background: var(--pop-cyan); }
.ws { flex: 1; height: 100%; display: flex; align-items: center; justify-content: space-around; overflow: hidden; }
.ws i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--pop-yellow); border: 2px solid var(--line); }
.wdemo[data-m="leitung"] .ws i { animation: jig .9s ease-in-out infinite; }
.wdemo[data-m="stroemung"] .ws i { animation: loopy 2.2s linear infinite; }
.wdemo[data-m="strahlung"] .ws i { animation: ray 1.4s linear infinite; border-radius: 3px; width: 24px; height: 8px; }
.ws i:nth-child(1) { animation-delay: 0s; } .ws i:nth-child(2) { animation-delay: .15s; } .ws i:nth-child(3) { animation-delay: .3s; }
.ws i:nth-child(4) { animation-delay: .45s; } .ws i:nth-child(5) { animation-delay: .6s; } .ws i:nth-child(6) { animation-delay: .75s; }
@keyframes jig { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
@keyframes loopy { 0% { transform: translate(0, -34px); } 25% { transform: translate(12px, 0); } 50% { transform: translate(0, 34px); } 75% { transform: translate(-12px, 0); } 100% { transform: translate(0, -34px); } }
@keyframes ray { 0% { transform: translateX(-30px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }

/* 7_7 Chemie: Periodensystem und Fotosynthese */
.pscroll { overflow-x: auto; padding-bottom: var(--space-2); }
.pse { border-collapse: separate; border-spacing: 3px; min-width: max-content; }
.pse td { width: 38px; height: 44px; padding: 0; }
.el { appearance: none; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; border: 3px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; color: var(--ink); line-height: 1.05; }
.el b { font-size: 0.95rem; } .el small { font-size: 0.6rem; font-weight: 700; }
.el.m { background: var(--pop-cyan); } .el.n { background: var(--pop-yellow); } .el.e { background: var(--pop-pink); } .el.h { background: var(--pop-green); }
.el.sel { outline: 4px solid var(--primary); outline-offset: 1px; }
.lgd.m { background: var(--pop-cyan); } .lgd.n { background: var(--pop-yellow); } .lgd.e { background: var(--pop-pink); } .lgd.h { background: var(--pop-green); }
.plant { position: relative; height: 120px; margin: var(--space-3) 0; border: 3px solid var(--line); border-radius: 12px; background: var(--accent-bg); overflow: hidden; }
.plant::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 8px; height: 70px; margin-left: -4px; background: var(--pop-green); border: 2px solid var(--line); border-radius: 4px; }
.bubbles { position: absolute; inset: 0; }
.bubbles i { position: absolute; bottom: 24px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); opacity: 0; }
.bubbles.on i { animation: rise2 var(--bd, 2s) linear infinite; }
.bubbles i:nth-child(1) { left: 44%; animation-delay: 0s; } .bubbles i:nth-child(2) { left: 48%; animation-delay: .4s; } .bubbles i:nth-child(3) { left: 52%; animation-delay: .9s; }
.bubbles i:nth-child(4) { left: 56%; animation-delay: 1.3s; } .bubbles i:nth-child(5) { left: 46%; animation-delay: 1.7s; } .bubbles i:nth-child(6) { left: 54%; animation-delay: 2.1s; }
@keyframes rise2 { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

/* 8_1 Stromkreise */
.circ { display: flex; align-items: center; gap: 4px; margin: var(--space-3) 0; }
.cbat { flex: none; border: 3px solid var(--line); border-radius: 8px; padding: 10px; background: var(--pop-yellow); color: var(--ink); font-weight: 800; font-size: var(--text-sm); }
.cwire { flex: 1; height: 10px; border: 2px solid var(--line); border-radius: 5px; background: var(--surface); }
.cwire.flow { background: repeating-linear-gradient(90deg, var(--pop-yellow) 0 12px, var(--surface) 12px 24px); background-size: 24px 100%; animation: flowx 1s linear infinite; }
.clamp { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); }
.clamp.on { background: var(--pop-yellow); box-shadow: 0 0 18px var(--pop-yellow); }
.lamps { display: flex; gap: 10px; margin: var(--space-3) 0; }
.lp { display: block; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); }
.lp.on { background: var(--pop-yellow); }
.gear { display: inline-block; font-size: 1.3rem; }
.gear.m, .gear.g { animation: spin 1.4s linear infinite; }
.gear.g { animation-direction: reverse; }
@keyframes flowx { to { background-position: 24px 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* 7_3 Sinne: Schallwelle, Ohr, Linse, Auge */
.wave { position: relative; height: 64px; margin: var(--space-3) 0; border: 3px solid var(--line); border-radius: 12px; background: var(--accent-bg); overflow: hidden; }
.wave i { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--primary); }
.ohrchain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: var(--space-3) 0; }
.ostep { border: 3px solid var(--line); border-radius: 10px; padding: 6px 8px; font-weight: 700; font-size: var(--text-sm); background: var(--surface); }
.ostep.on { background: var(--pop-yellow); color: var(--ink); }
.lensvg { display: block; width: 100%; max-width: 360px; margin: var(--space-3) auto; }
.lensvg .ax { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.lensvg .ray { stroke: var(--pop-pink); stroke-width: 3; fill: none; }
.lensvg .vray { stroke: var(--pop-pink); stroke-width: 2; stroke-dasharray: 4 4; }
.lensvg .lens { fill: var(--accent-bg); stroke: var(--line); stroke-width: 3; }
.lensvg .fp { fill: var(--pop-yellow); stroke: var(--line); stroke-width: 2; }
.lensvg .eye { fill: var(--surface); stroke: var(--line); stroke-width: 3; }
.lensvg .ret { stroke: var(--primary); stroke-width: 6; stroke-linecap: round; }

/* Trophäen */
.trophybar { appearance: none; display: flex; align-items: center; gap: var(--space-3); width: 100%; margin: var(--space-3) 0; padding: var(--space-3) var(--space-4); border: 3px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; box-shadow: 0 4px 0 var(--line); }
.trophybar .tb { display: flex; flex-direction: column; flex: 1; }
.trophybar .tb small { color: var(--ink-soft, var(--ink)); }
.tnew { background: var(--pop-pink); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: var(--text-sm); }
.ticon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 1.6rem; border: 3px solid var(--line); border-radius: 50%; background: var(--pop-yellow); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); margin: var(--space-3) 0; }
.trophy { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: var(--space-3); border: 3px solid var(--line); border-radius: 14px; background: var(--surface); }
.trophy b { font-family: var(--font-display); }
.trophy small { color: var(--ink); opacity: .85; }
.trophy.locked { opacity: .65; }
.trophy.locked .ticon { background: var(--subtle); filter: grayscale(1); }
.trophy .tdone { font-size: var(--text-sm); font-weight: 800; color: var(--primary); }

/* Schulwertung und Klassenduell */
.board li .nm small { display: block; font-size: 0.75rem; font-weight: 600; opacity: .8; }
.clsc .seg3 { margin: var(--space-2) 0; }

/* 8_5 Kräfte: Kraftmesser */
.spring { display: flex; flex-direction: column; align-items: center; height: 150px; margin: var(--space-3) 0; }
.sp { width: 16px; border: 2px solid var(--line); border-radius: 8px; background: repeating-linear-gradient(0deg, var(--line) 0 4px, var(--accent-bg) 4px 8px); transition: height .25s ease; }

<script>
(function () {
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const G = 10; // Ortsfaktor in N/kg (Annahme: Sek-Standard)
let RNG = Math.random; // wird für die Challenge kurz durch einen Seed-Generator ersetzt
const rnd = a => a[Math.floor(RNG() * a.length)];
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = (() => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; })();
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const NICK_A = ['Blitz', 'Funke', 'Turbo', 'Watt', 'Joule', 'Volt', 'Ampere', 'Kilo', 'Dynamo', 'Magnet'];
const NICK_B = ['Fuchs', 'Adler', 'Luchs', 'Falke', 'Dachs', 'Otter', 'Uhu', 'Igel'];
const newNick = () => NICK_A[Math.floor(Math.random() * NICK_A.length)] + '-' + NICK_B[Math.floor(Math.random() * NICK_B.length)];
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
function fmt(n, d) {
  d = d === undefined ? 3 : d;
  const f = Math.pow(10, d);
  n = Math.round(n * f) / f;
  const neg = n < 0;
  let [i, fr] = Math.abs(n).toString().split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
  return (neg ? '\u2212' : '') + i + (fr ? ',' + fr : '');
}
const num = (q, unit, ans, hint, explain, o) =>
  Object.assign({ type: 'num', q, unit, ans, hint, explain, tolRel: 0.01, tolAbs: 0 }, o || {});
// MC: options[0] ist die richtige Antwort, gemischt wird beim Anzeigen
const mc = (q, options, explain) => ({ type: 'mc', q, options, explain });

/* ---------- Inhalt: Elektromotor und Generator, 6 Stationen mit je 6 Aufgabenvorlagen ---------- */
const STATIONS = [
  {
    id: 'm1', nr: 1, title: 'Magnet und Elektromagnet', sub: 'Strom erzeugt ein Magnetfeld',
    items: [
      { id: 'm1-pole', topic: 'Magnetpole', make() {
        return mc('Du schneidest einen Stabmagneten in der Mitte durch. Was entsteht?', [
          'Zwei kleinere Magnete, jeder mit Nord- und Südpol.',
          'Ein Stück nur mit Nordpol und ein Stück nur mit Südpol.',
          'Zwei Stücke ohne Magnetismus.',
          'Ein Magnet mit zwei Nordpolen.'],
          'Magnete haben immer zwei Pole. Teilst du einen Magneten, entsteht an der Schnittstelle sofort ein neues Polpaar. Einzelne Pole gibt es nicht.');
      } },
      { id: 'm1-abstossen', topic: 'Anziehen und Abstossen', make() {
        return mc('Du hältst zwei Magnete so zusammen, dass sich Nordpol und Nordpol gegenüberstehen. Was passiert?', [
          'Sie stossen sich ab.',
          'Sie ziehen sich an.',
          'Nichts, Magnete wirken nur auf Eisen.',
          'Sie ziehen sich nur an, wenn Strom fliesst.'],
          'Gleichnamige Pole stossen sich ab, ungleichnamige ziehen sich an. Genau das nutzt später der Elektromotor.');
      } },
      { id: 'm1-oersted', topic: 'Magnetische Wirkung des Stroms', make() {
        return mc('Neben einem Draht liegt ein Kompass. Du schaltest den Strom im Draht ein. Was beobachtest du?', [
          'Die Kompassnadel schlägt aus: Der Strom erzeugt ein Magnetfeld.',
          'Nichts, denn Strom und Magnetismus haben nichts miteinander zu tun.',
          'Die Nadel dreht sich nur, wenn der Draht aus Eisen ist.',
          'Der Draht wird kalt.'],
          'Ein elektrischer Strom ist von einem Magnetfeld umgeben. Das hat Hans Christian Oersted entdeckt. Ohne diesen Zusammenhang gäbe es keinen Elektromotor.');
      } },
      { id: 'm1-staerke', topic: 'Elektromagnet verstärken', make() {
        return mc('Wie wird ein Elektromagnet stärker?', [
          'Mehr Windungen, grössere Stromstärke und ein Eisenkern in der Spule.',
          'Weniger Windungen und ein Holzkern.',
          'Ein dünnerer Draht und weniger Strom.',
          'Man muss den Magneten erwärmen.'],
          'Die Stärke wächst mit der Zahl der Windungen und mit der Stromstärke. Ein Eisenkern verstärkt das Magnetfeld noch einmal deutlich.');
      } },
      { id: 'm1-einaus', topic: 'Vorteil des Elektromagneten', make() {
        return mc('Ein Kran auf dem Schrottplatz hebt Autos mit einem Elektromagneten. Was ist der Vorteil gegenüber einem Dauermagneten?', [
          'Man kann ihn ausschalten, dann lässt er das Auto los.',
          'Er ist immer stärker als jeder Dauermagnet.',
          'Er braucht keine Energie.',
          'Er zieht auch Holz und Plastik an.'],
          'Ein Elektromagnet wirkt nur, solange Strom fliesst. Schaltest du aus, lässt er los. Auch Stärke und Polung lassen sich über den Strom steuern.');
      } },
      { id: 'm1-leistung', topic: 'Leistung des Elektromagneten', make() {
        const U = rnd([1.5, 3, 4.5, 6, 9, 12]), I = rnd([0.5, 1, 1.5, 2, 3]), P = U * I;
        return num(`Ein Elektromagnet wird an ${fmt(U)} V betrieben. Es fliesst ein Strom von ${fmt(I)} A. Wie gross ist die elektrische Leistung?`, 'W', P,
          'Elektrische Leistung = Spannung · Stromstärke.',
          `P = U · I = ${fmt(U)} V · ${fmt(I)} A = ${fmt(P)} W`);
      } }
    ]
  },
  {
    id: 'm2', nr: 2, title: 'Der Elektromotor', sub: 'Kraft im Magnetfeld',
    items: [
      { id: 'm2-kommutator', topic: 'Aufgabe des Kommutators', make() {
        return mc('Wozu dient der Kommutator (Polwender) in einem Gleichstrommotor?', [
          'Er kehrt die Stromrichtung in der Spule jede halbe Umdrehung um, damit sie weiterdreht.',
          'Er verstärkt die Spannung der Batterie.',
          'Er kühlt den Motor.',
          'Er bremst den Rotor ab.'],
          'Ohne Kommutator würde die Spule nach einer halben Umdrehung stehen bleiben, weil sich ihre Pole dann anziehen. Der Polwender kehrt rechtzeitig die Stromrichtung um, und die Spule dreht weiter.');
      } },
      { id: 'm2-umpolen', topic: 'Drehrichtung ändern', make() {
        return mc('Du vertauschst bei einem Gleichstrommotor die beiden Anschlüsse an der Batterie. Was passiert?', [
          'Der Motor dreht in die Gegenrichtung.',
          'Der Motor dreht gleich weiter.',
          'Der Motor bleibt stehen.',
          'Der Motor dreht doppelt so schnell.'],
          'Die Kraft im Magnetfeld hängt von der Stromrichtung ab. Kehrst du den Strom um, kehrt sich auch die Kraft um, und der Motor dreht rückwärts.');
      } },
      { id: 'm2-energie', topic: 'Energieumwandlung im Motor', make() {
        return mc('Welche Energieumwandlung findet in einem Elektromotor statt?', [
          'Elektrische Energie wird in Bewegungsenergie umgewandelt, ein Teil wird Wärme.',
          'Bewegungsenergie wird in elektrische Energie umgewandelt.',
          'Wärme wird in elektrische Energie umgewandelt.',
          'Elektrische Energie wird vollständig in Bewegung umgewandelt.'],
          'Der Motor wandelt elektrische in mechanische Energie um. Wegen Reibung und dem Widerstand der Spule wird immer ein Teil zu Wärme (Energieentwertung).');
      } },
      { id: 'm2-drehzahl', topic: 'Drehzahl und Spannung', make() {
        const U = rnd([1.5, 3, 4.5, 9, 12]), n = 3000 * U / 6;
        return num(`Ein Gleichstrommotor dreht ohne Last bei 6 V mit 3000 U/min. Rechne mit direkter Proportionalität zwischen Spannung und Drehzahl. Wie schnell dreht er bei ${fmt(U)} V ohne Last?`, 'U/min', n,
          'Berechne zuerst, wie viele Umdrehungen pro Minute es pro Volt sind (3000 : 6).',
          `3000 U/min : 6 V = 500 U/min pro V<br>n = ${fmt(U)} V · 500 U/min pro V = ${fmt(n)} U/min`);
      } },
      { id: 'm2-ups', topic: 'Umdrehungen pro Sekunde', make() {
        const n = rnd([600, 1200, 1800, 3000, 6000, 9000]), u = n / 60;
        return num(`Ein Motor dreht mit ${fmt(n)} U/min. Wie viele Umdrehungen macht er pro Sekunde?`, 'U/s', u,
          'Eine Minute hat 60 Sekunden.',
          `${fmt(n)} U/min : 60 = ${fmt(u)} Umdrehungen pro Sekunde`);
      } },
      { id: 'm2-blockiert', topic: 'Motor unter Last', ext: true, make() {
        return mc('Ein laufender Gleichstrommotor wird stark gebremst oder blockiert. Was passiert mit der Stromstärke?', [
          'Sie steigt stark an, der Motor kann überhitzen.',
          'Sie sinkt auf null.',
          'Sie bleibt immer gleich.',
          'Der Motor erzeugt dann Strom und die Batterie lädt sich auf.'],
          'Ein laufender Motor erzeugt selbst eine Gegenspannung, die den Strom begrenzt. Wird er gebremst, sinkt sie und der Strom steigt. Ein blockierter Motor nimmt sehr viel Strom auf, wird heiss und kann verbrennen. Darum niemals festhalten.');
      } }
    ]
  },
  {
    id: 'm3', nr: 3, title: 'Der Generator', sub: 'Bewegung wird zu Strom',
    items: [
      { id: 'm3-induktion', topic: 'Induktion', make() {
        return mc('Du bewegst einen Magneten in eine Spule, die an ein Voltmeter angeschlossen ist. Was beobachtest du?', [
          'Das Voltmeter zeigt eine Spannung, solange sich der Magnet bewegt.',
          'Das Voltmeter zeigt nur eine Spannung, wenn der Magnet ruhig in der Spule liegt.',
          'Das Voltmeter zeigt nichts, denn Magnete erzeugen keine Spannung.',
          'Das Voltmeter zeigt immer dieselbe Spannung.'],
          'Ändert sich das Magnetfeld in der Spule, entsteht eine Spannung (Induktion). Liegt der Magnet still, ändert sich nichts und die Spannung ist null.');
      } },
      { id: 'm3-motorgen', topic: 'Motor als Generator', make() {
        return mc('Du drehst die Achse eines kleinen Elektromotors von Hand und schliesst ein Voltmeter an. Was geschieht?', [
          'Das Voltmeter zeigt eine Spannung: Der Motor arbeitet als Generator.',
          'Nichts, ein Motor kann nur Strom verbrauchen.',
          'Der Motor wird kalt.',
          'Das Voltmeter zeigt nur eine Spannung, wenn zusätzlich eine Batterie angeschlossen ist.'],
          'Motor und Generator sind fast gleich gebaut. Wird die Achse von aussen gedreht, entsteht eine Spannung. Ein Generator ist also ein Motor, der rückwärts arbeitet.');
      } },
      { id: 'm3-kraftwerk', topic: 'Generatoren im Alltag', make() {
        return mc('Was haben Wasserkraftwerk, Windrad und Fahrraddynamo gemeinsam?', [
          'Alle treiben einen Generator an, der Bewegungsenergie in elektrische Energie umwandelt.',
          'Alle erzeugen Energie aus dem Nichts.',
          'Alle brauchen einen Verbrennungsmotor.',
          'Alle liefern nur Gleichspannung aus einer Batterie.'],
          'Wasser, Wind oder die Beine der Radfahrerin drehen einen Generator. Die Energie wird dabei nicht erzeugt, sondern von Bewegungsenergie in elektrische Energie umgewandelt.');
      } },
      { id: 'm3-spannung', topic: 'Spannung und Drehzahl', make() {
        const s = rnd([[60, 2, 150], [60, 3, 100], [120, 4, 30], [120, 6, 180], [50, 2, 125], [100, 5, 40]]);
        const U = s[1] * s[2] / s[0];
        return num(`Ein Handgenerator liefert bei ${fmt(s[0])} Umdrehungen pro Minute eine Spannung von ${fmt(s[1])} V. Rechne mit direkter Proportionalität. Welche Spannung liefert er bei ${fmt(s[2])} Umdrehungen pro Minute?`, 'V', U,
          'Wie oft so schnell wird gekurbelt? Um denselben Faktor ändert sich die Spannung.',
          `Faktor: ${fmt(s[2])} : ${fmt(s[0])} = ${fmt(s[2] / s[0])}<br>U = ${fmt(s[1])} V · ${fmt(s[2] / s[0])} = ${fmt(U)} V`);
      } },
      { id: 'm3-erhoehen', topic: 'Spannung erhöhen', make() {
        return mc('Wie lässt sich die Spannung eines Generators erhöhen?', [
          'Schneller drehen, mehr Windungen oder einen stärkeren Magneten verwenden.',
          'Langsamer drehen.',
          'Weniger Windungen verwenden.',
          'Den Magneten aus der Spule nehmen.'],
          'Die Spannung steigt, wenn sich das Magnetfeld schneller ändert (höhere Drehzahl), wenn die Spule mehr Windungen hat und wenn der Magnet stärker ist.');
      } },
      { id: 'm3-energie', topic: 'Elektrische Energie des Generators', make() {
        const s = rnd([[6, 0.5, 20], [4, 0.5, 30], [3, 1, 20], [6, 1, 10], [2, 0.5, 60], [12, 0.5, 15]]);
        const E = s[0] * s[1] * s[2];
        return num(`Ein Handgenerator liefert ${fmt(s[0])} V bei ${fmt(s[1])} A. Du kurbelst ${fmt(s[2])} s lang. Welche elektrische Energie hat er in dieser Zeit abgegeben?`, 'J', E,
          'Erst die Leistung P = U · I, dann die Energie E = P · t.',
          `P = U · I = ${fmt(s[0])} V · ${fmt(s[1])} A = ${fmt(s[0] * s[1])} W<br>E = P · t = ${fmt(s[0] * s[1])} W · ${fmt(s[2])} s = ${fmt(E)} J`);
      } }
    ]
  },
  {
    id: 'm4', nr: 4, title: 'Leistung und Wirkungsgrad', sub: 'η = P_mech : P_el',
    items: [
      { id: 'm4-pel', topic: 'Aufgenommene Leistung', make() {
        const s = rnd([[6, 0.5], [12, 2], [12, 4], [24, 5], [9, 1], [24, 2.5]]);
        const P = s[0] * s[1];
        return num(`Ein Motor wird an ${fmt(s[0])} V betrieben und nimmt ${fmt(s[1])} A auf. Welche elektrische Leistung nimmt er auf?`, 'W', P,
          'P = U · I.',
          `P_el = U · I = ${fmt(s[0])} V · ${fmt(s[1])} A = ${fmt(P)} W`);
      } },
      { id: 'm4-eta', topic: 'Wirkungsgrad berechnen', make() {
        const s = rnd([[50, 40], [100, 85], [200, 160], [500, 450], [120, 90], [80, 60]]);
        const eta = s[1] / s[0] * 100;
        return num(`Ein Motor nimmt ${fmt(s[0])} W elektrische Leistung auf und gibt ${fmt(s[1])} W mechanische Leistung ab. Wie gross ist sein Wirkungsgrad?`, '%', eta,
          'η = abgegebene Leistung : aufgenommene Leistung, dann mal 100.',
          `η = P_mech : P_el = ${fmt(s[1])} W : ${fmt(s[0])} W = ${fmt(eta / 100)} = ${fmt(eta)} %`);
      } },
      { id: 'm4-verlust', topic: 'Verlustleistung', make() {
        const P = rnd([50, 100, 200, 400]), eta = rnd([60, 70, 80, 90]), V = P * (100 - eta) / 100;
        return num(`Ein Motor nimmt ${fmt(P)} W auf und hat einen Wirkungsgrad von ${fmt(eta)} %. Wie viel Leistung geht als Wärme verloren?`, 'W', V,
          'Der Rest, der nicht abgegeben wird, geht verloren: (100 % − η) von der aufgenommenen Leistung.',
          `P_mech = ${fmt(eta / 100)} · ${fmt(P)} W = ${fmt(P * eta / 100)} W<br>Verlust = ${fmt(P)} W − ${fmt(P * eta / 100)} W = ${fmt(V)} W`);
      } },
      { id: 'm4-heben', topic: 'Hubleistung', make() {
        const s = rnd([[20, 2, 5], [10, 3, 6], [5, 2, 2], [40, 1, 5], [25, 2, 5], [50, 3, 10]]);
        const P = s[0] * 10 * s[1] / s[2];
        return num(`Ein Motor hebt eine Last von ${fmt(s[0])} kg in ${fmt(s[2])} s um ${fmt(s[1])} m. Welche mechanische Leistung gibt er dabei ab? Rechne mit g = 10 N/kg.`, 'W', P,
          'Zuerst die Hubarbeit W = m · g · h, dann P = W : t.',
