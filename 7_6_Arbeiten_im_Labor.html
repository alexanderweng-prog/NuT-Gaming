<script>
(function () {
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const G = 10; // Ortsfaktor in N/kg (Annahme: Sek-Standard)
let RNG = Math.random; // wird für die Challenge kurz durch einen Seed-Generator ersetzt
const rnd = a => a[Math.floor(RNG() * a.length)];
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = (() => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; })();
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const NICK_A = ['Blitz', 'Funke', 'Turbo', 'Watt', 'Joule', 'Volt', 'Ampere', 'Kilo', 'Dynamo', 'Magnet'];
const NICK_B = ['Fuchs', 'Adler', 'Luchs', 'Falke', 'Dachs', 'Otter', 'Uhu', 'Igel'];
const newNick = () => NICK_A[Math.floor(Math.random() * NICK_A.length)] + '-' + NICK_B[Math.floor(Math.random() * NICK_B.length)];
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
function fmt(n, d) {
  d = d === undefined ? 3 : d;
  const f = Math.pow(10, d);
  n = Math.round(n * f) / f;
  const neg = n < 0;
  let [i, fr] = Math.abs(n).toString().split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
  return (neg ? '\u2212' : '') + i + (fr ? ',' + fr : '');
}
const num = (q, unit, ans, hint, explain, o) =>
  Object.assign({ type: 'num', q, unit, ans, hint, explain, tolRel: 0.01, tolAbs: 0 }, o || {});
// MC: options[0] ist die richtige Antwort, gemischt wird beim Anzeigen
const mc = (q, options, explain) => ({ type: 'mc', q, options, explain });

/* ---------- Inhalt: 7_6 Arbeiten im Labor, 6 Stationen ----------
   Quelle: Lehrerkommentar zu Kapitel 6 «Arbeiten im Labor» (eigene Formulierungen). */
const r2 = x => Math.round(x * 1000) / 1000;
const STATIONS = [
  {
    id: 'r1', nr: 1, title: 'Stoffe und Laborregeln', sub: 'Sicher arbeiten',
    items: [
      { id: 'r1-stoff', topic: 'Stoff und Gegenstand', make() {
        return mc('Was ist der Unterschied zwischen einem Stoff und einem Gegenstand?', ['Ein Gegenstand (zum Beispiel ein Wecker) besteht aus Stoffen (zum Beispiel Metall und Glas).', 'Stoffe sind nur Kleiderstoffe.', 'Gegenstände bestehen aus nichts.', 'Es gibt keinen Unterschied.'],
          'Im Alltag meint «Stoff» oft Kleiderstoff. In der Chemie sind Stoffe die Materialien, aus denen Gegenstände bestehen.');
      } },
      { id: 'r1-chemie', topic: 'Womit sich die Chemie befasst', make() {
        return mc('Womit beschäftigt sich die Chemie?', ['Mit allen Stoffen, auch mit natürlichen. Künstliche Stoffe sind nicht dasselbe wie chemische Stoffe.', 'Nur mit künstlich hergestellten Stoffen.', 'Nur mit Giftstoffen.', 'Nur mit Stoffen aus dem Labor.'],
          'Auch Luft, Wasser und Holz sind Stoffe. Die Welt der Stoffe ist keine Welt voller Gefahren.');
      } },
      { id: 'r1-schutz', topic: 'Schutzbrille und Haare', make() {
        return mc('Wie schützt du dich beim Experimentieren?', ['Ich trage immer eine Schutzbrille und binde lange Haare zusammen.', 'Ich trage die Brille nur beim Brenner.', 'Ich lasse lange Haare offen.', 'Ich arbeite ohne Schutz, wenn es schnell geht.'],
          'Die Schutzbrille wird dauernd getragen, nicht nur bei gefährlich scheinenden Versuchen.');
      } },
      { id: 'r1-essen', topic: 'Essen und Trinken', make() {
        return mc('Du bist im Labor durstig. Was gilt?', ['Im Labor wird nicht gegessen und nicht getrunken. Pause machst du ausserhalb.', 'Aus sauberen Bechergläsern darfst du trinken.', 'Du darfst Stoffe probieren, wenn sie gut riechen.', 'Du darfst essen, wenn du fertig bist.'],
          'Chemikalien können gesundheitsschädlich sein. Darum schmeckst du nie an Stoffen.');
      } },
      { id: 'r1-geruch', topic: 'Gerüche prüfen', make() {
        return mc('Wie prüfst du den Geruch eines Stoffes?', ['Ich fächle den Dampf vorsichtig mit der Hand zur Nase und rieche nie direkt am Gefäss.', 'Ich halte die Nase direkt über das Gefäss.', 'Ich atme tief ein.', 'Ich rieche nie an etwas.'],
          'Auch gebrauchte Stoffe gibst du nie in das Vorratsgefäss zurück, aus dem sie stammen.');
      } },
      { id: 'r1-anleit', topic: 'Anleitung lesen', make() {
        return mc('Was gehört zu sicherem Arbeiten, bevor du beginnst?', ['Die Anleitung genau lesen, die Gefahrensymbole der Stoffe beachten und den Arbeitsplatz ordnen.', 'Sofort losarbeiten.', 'Nur zuschauen, wie andere es machen.', 'Alle Chemikalien ausprobieren.'],
          'Auch scheinbar harmlose Stoffe aus dem Haushalt können gefährlich werden. Kenntnis der Gefahr hilft, sie abzuwenden.');
      } }
    ]
  },
  {
    id: 'r2', nr: 2, title: 'Gasbrenner und Chemikalien', sub: 'Heizen, Symbole und Abfälle',
    items: [
      { id: 'r2-unterlage', topic: 'Unterlage und Lüftung', make() {
        return mc('Worauf achtest du bei der Arbeit mit dem Gasbrenner?', ['Auf eine wärmefeste, asbestfreie Unterlage (mindestens 45 cm × 45 cm), gute Lüftung und höchstens acht Brenner gleichzeitig im Zimmer.', 'Der Brenner steht direkt auf dem Pult.', 'Ein Brenner genügt für das ganze Zimmer ohne Lüftung.', 'Haare dürfen offen sein.'],
          'Weil Brandgefahr besteht, braucht die Lehrperson eine gute Übersicht. Darum arbeitest du oft in Dreiergruppen.');
      } },
      { id: 'r2-flamme', topic: 'Flammen unterscheiden', make() {
        return mc('Was unterscheidet die leuchtende von der nicht leuchtenden (rauschenden) Flamme?', ['Die leuchtende Flamme hat wenig Luft, russt und ist weniger heiss. Die rauschende Flamme hat mehr Luft und ist heisser.', 'Die leuchtende Flamme ist heisser.', 'Beide sind gleich heiss.', 'Die Luftzufuhr spielt keine Rolle.'],
          'Mit der Luftregulierung stellst du die Flamme ein. Die heisseste Stelle liegt über dem Innenkegel.');
      } },
      { id: 'r2-flaeche', topic: 'Grösse der Unterlage', ext: true, make() {
        const s = rnd([[45, 45], [40, 60], [50, 50], [60, 60], [45, 60]]), a = s[0] * s[1];
        return num(`Eine wärmefeste Unterlage ist ${fmt(s[0])} cm lang und ${fmt(s[1])} cm breit. Wie gross ist die Fläche?`, 'cm²', a, 'Fläche = Länge · Breite', `${fmt(s[0])} cm · ${fmt(s[1])} cm = ${fmt(a)} cm²`);
      } },
      { id: 'r2-ghs', topic: 'Gefahrensymbole', make() {
        return mc('Welche Gefahrensymbole (GHS) sind in der Schule besonders wichtig?', ['Hochentzündlich, brandfördernd, Gas unter Druck, ätzend und umweltgefährlich.', 'Nur das Symbol «giftig».', 'Gar keine.', 'Nur Symbole auf Lebensmitteln.'],
          'GHS heisst Globally Harmonized System. Giftige und krebserzeugende Stoffe dürfen im Schulunterricht nicht verwendet werden.');
      } },
      { id: 'r2-abfall', topic: 'Abfälle', make() {
        return mc('Wohin gehören Abfälle aus dem Experimentieren?', ['In die dafür vorgesehenen Behälter: Lösungsmittel, Schwermetalllösungen und Glasbruch getrennt.', 'In den Hausmüll.', 'In den Abfluss.', 'Alles in einen Behälter.'],
          'Leere Gaskartuschen gehören in den Metallabfall. Beachte die Hinweise der Lehrperson.');
      } },
      { id: 'r2-notfall', topic: 'Im Notfall', make() {
        return mc('Was tust du im Notfall mit Chemikalien?', ['Sofort die Lehrperson rufen. Bei ätzenden Stoffen auf Haut oder Auge lange mit viel Wasser spülen. Tox Info Suisse hat die Nummer 145.', 'Abwarten, ob es von selbst vergeht.', 'Nichts melden.', 'Die Stoffe trinken, um sie zu verdünnen.'],
          'Im Ernstfall muss sofort korrekt gehandelt werden. Darum kennst du die Abläufe vorher.');
      } }
    ]
  },
  {
    id: 'r3', nr: 3, title: 'Laborgeräte und Messen', sub: 'Volumen und Masse',
    items: [
      { id: 'r3-glas', topic: 'Glas und Kunststoff', make() {
        return mc('Wie gehst du mit Glas- und Kunststoffgeräten um?', ['Glas ist hitzebeständig, aber zerbrechlich. Kunststoffgeräte erhitzt du nicht über dem Brenner.', 'Beide kann man direkt in die Flamme halten.', 'Kunststoff ist hitzebeständiger als Glas.', 'Glas geht nie kaputt.'],
          'Glasgeräte reinigst du mit passenden Bürsten und behandelst sie sorgfältig.');
      } },
      { id: 'r3-skala', topic: 'Skalen', make() {
        return mc('Wie unterscheiden sich die Skalen bei Messzylinder und Pipette?', ['Beim Messzylinder steigt die Skala von unten nach oben. Bei Pipette und Bürette läuft sie von oben nach unten.', 'Alle Skalen laufen von oben nach unten.', 'Bei Messzylinder und Pipette sind sie gleich.', 'Eine Skala gibt es nur bei der Waage.'],
          'Beim Ablesen beachtest du den Meniskus, also die Wölbung der Flüssigkeitsoberfläche, und schaust waagrecht darauf.');
      } },
      { id: 'r3-pipette', topic: 'Pipettieren', make() {
        return mc('Wie füllst du eine Messpipette?', ['Immer mit Peleusball oder anderer Pipettierhilfe, nie mit dem Mund.', 'Mit dem Mund ansaugen.', 'Mit dem Finger ansaugen.', 'Gar nicht, man giesst direkt.'],
          'Das Ansaugen mit dem Mund ist gefährlich, weil Flüssigkeit in den Mund gelangen kann.');
      } },
      { id: 'r3-masse', topic: 'Masse und Gewicht', make() {
        return mc('Welcher Begriff ist in den Naturwissenschaften richtig, wenn du mit der Waage misst?', ['Masse.', 'Gewicht.', 'Volumen.', 'Dichte.'],
          'Im Alltag sagt man oft Gewicht. Eine Waage zeigt aber die Masse, in Gramm oder Kilogramm. Eine Waage hat eine Maximallast und eine bestimmte Genauigkeit.');
      } },
      { id: 'r3-ml', topic: 'Millilitern in Liter', make() {
        const n = rnd([250, 500, 750, 100, 1500, 50]), l = r2(n / 1000);
        return num(`Ein Becherglas fasst ${fmt(n)} mL. Wie viele Liter sind das?`, 'L', l, '1 L = 1000 mL', `${fmt(n)} mL : 1000 = ${fmt(l)} L`);
      } },
      { id: 'r3-cm3', topic: 'Liter in Kubikzentimeter', make() {
        const l = rnd([0.5, 1, 1.5, 2, 3]), c = l * 1000;
        return num(`Ein Gefäss fasst ${fmt(l)} Liter. Wie viele Kubikzentimeter (cm³) sind das? Es gilt 1 L = 1000 cm³.`, 'cm³', c, 'Multipliziere mit 1000.', `${fmt(l)} L · 1000 = ${fmt(c)} cm³`);
      } }
    ]
  },
  {
    id: 'r4', nr: 4, title: 'Stoffeigenschaften', sub: 'Dichte, Magnetismus und Zustände',
    items: [
      { id: 'r4-magnet', topic: 'Magnetismus', make() {
        return mc('Welche Stoffe werden von einem Magneten angezogen?', ['Eisen, Nickel und Kobalt (zum Beispiel Münzen aus reinem Nickel).', 'Alle Metalle.', 'Kupfer und Aluminium.', 'Alle festen Stoffe.'],
          'Nicht jedes Metall ist magnetisch. Du untersuchst Stoffe (Materialien), nicht Gegenstände.');
      } },
      { id: 'r4-ph', topic: 'pH-Wert messen', make() {
        return mc('Wie untersuchst du mit pH-Papier einen Feststoff oder ein Gas?', ['Man befeuchtet das pH-Papier und hält es ins Gas oder streicht über die Oberfläche des Feststoffs.', 'Gar nicht möglich.', 'Man taucht den Feststoff in das trockene Papier.', 'Man erhitzt das Papier.'],
          'Der pH-Wert kann eigentlich nur bei Flüssigkeiten gemessen werden. Bei Gasen und Feststoffen hilft das befeuchtete Papier.');
      } },
      { id: 'r4-dichte', topic: 'Dichte und Schwimmen', make() {
        return mc('Ein Körper hat eine kleinere Dichte als Wasser (1 g/cm³). Was geschieht?', ['Er schwimmt auf dem Wasser.', 'Er sinkt zu Boden.', 'Er löst sich auf.', 'Er schmilzt.'],
          'Die Dichte gibt an, wie viel Masse in einem bestimmten Volumen steckt. Körper mit grösserer Dichte als Wasser sinken.');
      } },
      { id: 'r4-dichte-num', topic: 'Dichte berechnen', make() {
        const s = rnd([[54, 20], [100, 50], [78, 10], [27, 10], [160, 20], [45, 50]]), d = r2(s[0] / s[1]);
        return num(`Ein Quader hat die Masse ${fmt(s[0])} g und das Volumen ${fmt(s[1])} cm³. Wie gross ist seine Dichte?`, 'g/cm³', d, 'Dichte = Masse : Volumen', `ρ = ${fmt(s[0])} g : ${fmt(s[1])} cm³ = ${fmt(d)} g/cm³`);
      } },
      { id: 'r4-masse-num', topic: 'Masse aus der Dichte', ext: true, make() {
        const s = rnd([[2.7, 10], [7.8, 5], [0.7, 20], [1, 50], [8.9, 10]]), m = r2(s[0] * s[1]);
        return num(`Ein Stoff hat die Dichte ${fmt(s[0])} g/cm³. Welche Masse hat ${fmt(s[1])} cm³ davon?`, 'g', m, 'Masse = Dichte · Volumen', `m = ${fmt(s[0])} g/cm³ · ${fmt(s[1])} cm³ = ${fmt(m)} g`);
      } },
      { id: 'r4-uebergang', topic: 'Zustandsänderungen', make() {
        return mc('Wie heisst der Übergang von flüssig zu gasförmig und der von gasförmig zu flüssig?', ['Verdampfen und Kondensieren.', 'Schmelzen und Erstarren.', 'Erstarren und Schmelzen.', 'Sublimieren und Resublimieren.'],
          'Weitere Namen: Schmelzen (fest zu flüssig), Erstarren (flüssig zu fest), Sublimieren (fest zu gasförmig), Resublimieren (gasförmig zu fest). Wasser schmilzt bei 0 °C und siedet bei 100 °C.');
      } }
    ]
  },
  {
    id: 'r5', nr: 5, title: 'Trennverfahren', sub: 'Im Labor und im Alltag',
    items: [
      { id: 'r5-filter', topic: 'Filtration', make() {
        return mc('Wie funktioniert die Filtration?', ['Ein Filter hält feste Teilchen zurück, die zu gross für die Poren sind (Rückstand). Die Flüssigkeit läuft als Filtrat hindurch.', 'Der Filter löst die Feststoffe auf.', 'Der Filter hält Flüssigkeit zurück.', 'Man erhitzt das Gemisch.'],
          'So trennst du zum Beispiel Sand und Salzwasser. Etwas Salzwasser bleibt im Filterpapier hängen.');
      } },
      { id: 'r5-extrakt', topic: 'Extraktion', make() {
        return mc('Beim Teekochen lösen sich Stoffe aus den Teeblättern. Wie heisst dieser Vorgang?', ['Extraktion.', 'Destillation.', 'Chromatografie.', 'Filtration.'],
          'Im heissen Wasser lösen sich einige Bestandteile, wasserunlösliche bleiben im Teebeutel. Die Teilchen bewegen sich bei höherer Temperatur schneller, darum verteilt sich der Tee schneller.');
      } },
      { id: 'r5-destill', topic: 'Destillation', make() {
        return mc('Wie trennt man bei der Destillation Wasser und Ethanol aus Rotwein?', ['Man erhitzt vorsichtig. Der Stoff mit dem tieferen Siedepunkt verdampft zuerst und wird danach wieder abgekühlt (Destillat).', 'Man kühlt auf −50 °C.', 'Man filtert durch Papier.', 'Man schüttelt kräftig.'],
          'Der Rotwein wird nicht über etwa 85 °C erhitzt. Die Destillation von Erdöl ist nur ein Demonstrationsexperiment der Lehrperson.');

      { id: 'r5-adsorp', topic: 'Adsorption', make() {
        return mc('Wie entfärbst du mit Aktivkohle ein Getränk wie Cola?', ['Die Farbstoffe lagern sich an der Aktivkohle an (Adsorption). Danach filtriert man die Kohle ab.', 'Man verdampft das Getränk.', 'Man kühlt es ab.', 'Man rührt Zucker ein.'],

      } },
      { id: 'r5-chrom', topic: 'Chromatografie', make() {
        return mc('Wie funktioniert die Chromatografie mit Filzstiftfarben?', ['Das Laufmittel (Wasser) saugt sich im Papier hoch und nimmt die Farbstoffe verschieden weit mit. So werden sie getrennt.', 'Die Farben verdampfen.', 'Die Farben werden gefiltert.', 'Das Papier verbrennt.'],
          'Laboranten trennen so zum Beispiel Blattfarbstoffe. Dunkle, braune und schwarze Stifte eignen sich besonders.');
      } },
      { id: 'r5-alltag', topic: 'Trennverfahren im Alltag', make() {
        return mc('Wo kommen Trennverfahren im Alltag vor?', ['In der Waschmaschine, in der Kläranlage, bei der Abfalltrennung und beim Kaffee- und Teekochen.', 'Nur im Labor.', 'Nur in der Industrie.', 'Nirgends.'],
          'In der Kläranlage werden viele Stoffe aus dem Abwasser entfernt, bevor es in ein Gewässer gelangt.');
      } },

function sorter(el, items, names, intro, endText) {
  el.innerHTML = `<div class="sim"><p class="small" id="gn" aria-live="polite"></p><p class="gcard" id="gc"></p>
    <div class="gbtns" id="gb">${Object.keys(names).map(k => `<button class="btn sm" data-g="${k}">${names[k]}</button>`).join('')}</div>
    <p class="readout" id="ro" aria-live="polite"></p>
    <button class="btn btn-primary block" id="nx" hidden>Weiter zum nächsten Beispiel</button></div>`;
  let i = 0, score = 0, done = false;
  function show() {
    done = false; $id('nx').hidden = true;
    if (i >= items.length) {
      $id('gn').textContent = ''; $id('gc').textContent = 'Geschafft!'; $id('gb').hidden = true;
      $id('ro').innerHTML = `<b>${score} von ${items.length}</b> beim ersten Tipp richtig. ${endText}`;
      const again = document.createElement('button'); again.className = 'btn sm'; again.textContent = 'Nochmals spielen';
      again.addEventListener('click', () => { i = 0; score = 0; $id('gb').hidden = false; again.remove(); show(); });
      $id('ro').appendChild(document.createElement('br')); $id('ro').appendChild(again); return;
    }
    $id('gn').textContent = 'Beispiel ' + (i + 1) + ' von ' + items.length;
    $id('gc').textContent = items[i].t; $id('ro').textContent = intro;
    el.querySelectorAll('[data-g]').forEach(b => b.classList.remove('good', 'bad'));
  }
  el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {
    if (i >= items.length) return;
    if (done) { show(); return; }
    done = true;
    const it = items[i], ok = it.ok.includes(b.dataset.g);
    if (ok) score++;
    el.querySelectorAll('[data-g]').forEach(x => { if (it.ok.includes(x.dataset.g)) x.classList.add('good'); else if (x === b) x.classList.add('bad'); });
    $id('ro').innerHTML = (ok ? '<b>Richtig.</b> ' : '<b>Nicht ganz.</b> ') + it.why;
    i++;
    const nx = $id('nx'); nx.hidden = false; nx.textContent = i >= items.length ? 'Ergebnis ansehen' : 'Weiter zum nächsten Beispiel';
    if (nx.scrollIntoView) nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }));
  $id('nx').addEventListener('click', show);
  show();
}

function tween(from, to, ms, cb) {
  if (reduced() || from === to) { cb(to); return; }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / ms);
    cb(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

let R = null;

function inst(tpl, retry) {
  const d = tpl.make();
  if (d.type === 'mc') d.shown = shuffle(d.options.map((t, i) => ({ t, ok: i === 0 })));
  return { tpl, d, retry: !!retry, attempts: 0, done: false, sel: null, input: '', fb: null, firstLogged: false };
}
function buildChallenge(code) {
  const m = /^([1-6])-/.exec(code); const N = m ? +m[1] : 6;
  RNG = seeded(TOPIC.id + ':' + code);
  try {
    const used = new Set(), picks = [];
    for (let i = 0; i < 6; i++) {
      const st = STATIONS[i % N];
      const pool = st.items.filter(t => !used.has(t.id));
      const t = rnd(pool.length ? pool : st.items);
      used.add(t.id); picks.push(t);
    }
    return shuffle(picks).map(t => inst(t));
  } finally { RNG = Math.random; }
}
function startRound(what, code) {
  if (what === 'challenge') {
    R = { mode: 'challenge', code, st: null, queue: buildChallenge(code), i: 0, results: [], xp: 0, base: 6, t0: Date.now() };
    ui.screen = 'round'; ui.formulas = false;
    render();
    return;
  }
  let tpls, st = null;
  if (what === 'review') {
    const now = Date.now();
    tpls = reviewPool().map(t => {
      const it = state.items[t.id] || { box: 0, due: 0 };
      return { t, k: (it.due <= now ? 0 : 1) * 10 + it.box + Math.random() };
    }).sort((a, b) => a.k - b.k).slice(0, ROUND_SIZE).map(x => x.t);
    tpls = shuffle(tpls);
  } else {
    st = STATIONS.find(s => s.id === what);
    tpls = shuffle(st.items);
  }
  R = { mode: what === 'review' ? 'review' : 'station', st, queue: tpls.map(t => inst(t)), i: 0, results: [], xp: 0, base: tpls.length };
  ui.screen = 'round'; ui.formulas = false;
  render();
}
function logFirst(q, ok) {

    logFirst(q, false);
    q.fb = { kind: 'bad', title: 'Nicht ganz.', body: 'Richtig wäre ' + fmt(d.ans, 2) + ' ' + d.unit + '.<br>' + d.explain };
  }
  render('fb');
}
function nextQ() {
  R.i += 1;
  if (R.i >= R.queue.length) finishRound(); else render();
}
function finishRound() {
  const before = state.xp;
  const lvBefore = levelOf(before);
  const c = R.results.slice(0, R.base).filter(r => r.ok).length;
  const stars = starsFor(c);
  let bonus = 0;
  if (R.mode === 'station') bonus = stars === 3 ? 20 : stars === 2 ? 10 : stars === 1 ? 5 : 0;
  else if (R.mode === 'challenge') bonus = c === 6 ? 20 : c >= 4 ? 10 : 0;
  else bonus = c >= 5 ? 10 : 0;
  // Karteikasten aktualisieren
  const now = Date.now();
  R.results.forEach(r => {
    const it = state.items[r.id] || { box: 0, due: 0 };
    it.box = r.ok ? Math.min(4, it.box + 1) : 0;
    it.due = now + INTERVALS[it.box] * 86400000;
    state.items[r.id] = it;
  });
  if (R.mode === 'station') state.stars[R.st.id] = Math.max(state.stars[R.st.id] || 0, stars);
  let chInfo = null;
  if (R.mode === 'challenge') {
    const t = Math.max(1, Math.round((Date.now() - R.t0) / 1000));
    const prev = state.challenges[R.code] || null;
    if (!prev) state.challenges[R.code] = { c, t };
    chInfo = { code: R.code, c, t, prev, line: `${state.nick} \u00B7 ${c} von 6 \u00B7 ${t} s \u00B7 Code ${R.code}` };
  }
  const gained = R.xp + bonus;
  bumpXp(gained);
  state.rounds += 1;
  if (c === R.base) state.perfect = (state.perfect || 0) + 1;
  if (R.mode === 'review') state.reviews = (state.reviews || 0) + 1;
  touchStreak();
  const newTrophies = checkTrophies();
  save();
  R.summary = {
    c, stars, bonus, gained, base: R.base, ch: chInfo,
    levelUp: levelOf(state.xp) > lvBefore ? levelOf(state.xp) : null, newTrophies,
    missed: R.results.filter(r => !r.ok).map(r => r.topic)
  };
  if (R.mode === 'challenge') { BE.chBoard = null; BE.chStatus = ''; BE.chClasses = null; BE.chClsStatus = ''; }
  ui.screen = 'summary';
  render();
  if (state.classCode) pushProgress();
  if (R.mode === 'challenge') afterChallenge(chInfo);
}

/* ---------- QR-Lernstand: Verschlüsselung (WebCrypto) ----------
   Hybridverfahren: Die Schüler-App kennt nur den ÖFFENTLICHEN Schlüssel der Lehrperson.
   Pro Code wird ein neues Schlüsselpaar erzeugt (ECDH P-256), daraus per HKDF ein AES-GCM-Schlüssel
   abgeleitet und der Lernstand verschlüsselt. Nur der private Schlüssel der Prüf-App kann ihn öffnen.
   Format: "LQ1." + base64url( [Version, Komprimiert] + 65 Byte Absender-Schlüssel + 12 Byte IV + Chiffrat )   */
const LQ = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const b64u = {
    enc(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
    dec(str) { let s = str.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  };
  async function pipe(u8, stream) {
    const w = stream.writable.getWriter(); w.write(u8); w.close();
    return new Uint8Array(await new Response(stream.readable).arrayBuffer());
  }
  const deflate = u8 => (typeof CompressionStream === 'undefined' ? Promise.resolve(null) : pipe(u8, new CompressionStream('deflate-raw')));
  const inflate = u8 => pipe(u8, new DecompressionStream('deflate-raw'));
  const ALGO = { name: 'ECDH', namedCurve: 'P-256' };
  async function aesKey(secretBits, usage) {
    const hk = await crypto.subtle.importKey('raw', secretBits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: te.encode('leistung-qr-v1') }, hk, { name: 'AES-GCM', length: 256 }, false, [usage]);
  }
  return {
    b64u,
    randomId(n) { return b64u.enc(crypto.getRandomValues(new Uint8Array(n))); },
    // Lehrperson: Schlüsselpaar erzeugen. publicKey = Text für config.js, privateJwk bleibt in der Prüf-App.
    async generateTeacherKeys() {
      const kp = await crypto.subtle.generateKey(ALGO, true, ['deriveBits']);
      return { publicKey: b64u.enc(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey))), privateJwk: await crypto.subtle.exportKey('jwk', kp.privateKey) };
    },
    async encrypt(teacherPublicKey, obj) {
      const raw = te.encode(JSON.stringify(obj));
      let body = raw, flag = 0;
      const z = await deflate(raw);
      if (z && z.length < raw.length) { body = z; flag = 1; }
      const pub = await crypto.subtle.importKey('raw', b64u.dec(teacherPublicKey), ALGO, false, []);
      const eph = await crypto.subtle.generateKey(ALGO, true, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, eph.privateKey, 256);
      const key = await aesKey(bits, 'encrypt');
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const header = new Uint8Array([1, flag]);
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: header }, key, body));
      const ephRaw = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
      const out = new Uint8Array(2 + 65 + 12 + ct.length);
      out.set(header, 0); out.set(ephRaw, 2); out.set(iv, 67); out.set(ct, 79);
      return 'LQ1.' + b64u.enc(out);
    },
    async decrypt(token, privateJwk) {
      if (typeof token !== 'string' || token.slice(0, 4) !== 'LQ1.') throw new Error('Das ist kein Lernstand-Code dieser App.');
      let data;
      try { data = b64u.dec(token.slice(4).trim()); } catch (e) { throw new Error('Der Code ist beschädigt.'); }
      if (data.length < 80 || data[0] !== 1) throw new Error('Unbekannte Version oder beschädigter Code.');
      const header = data.slice(0, 2), ephRaw = data.slice(2, 67), iv = data.slice(67, 79), ct = data.slice(79);
      try {
        const priv = await crypto.subtle.importKey('jwk', privateJwk, ALGO, false, ['deriveBits']);
        const eph = await crypto.subtle.importKey('raw', ephRaw, ALGO, false, []);
        const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: eph }, priv, 256);
        const key = await aesKey(bits, 'decrypt');
        let body = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: header }, key, ct));
        if (header[1] === 1) body = await inflate(body);
        return JSON.parse(td.decode(body));
      } catch (e) {
        throw new Error('Der Code lässt sich mit deinem Schlüssel nicht öffnen. Er wurde verändert oder gehört zu einem anderen Schlüssel.');
      }
    }
  };
})();

let authP = null;
function ensureAuth() {
  if (!authP) {
    authP = (async () => {
      const s = await BE.client.auth.getSession();
      if (s && s.data && s.data.session) return;
      const r = await BE.client.auth.signInAnonymously();
      if (r.error) throw r.error;
    })().catch(e => { authP = null; throw e; });
  }
  return authP;
}
async function rpc(name, args) {
  await ensureAuth();

  return r.data;
}
const wait = ms => new Promise(res => setTimeout(res, ms));

async function pushProgress() {
  if (!BE.client || !state.classCode) return;
  if (BE.pushing) { BE.pushAgain = true; return; }
  BE.pushing = true;
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const wk = weekKey();
        await rpc('submit_progress', {
          p_topic: TOPIC.id, p_class: state.classCode, p_nick: state.nick, p_week: wk,
          p_week_xp: state.weekKey === wk ? state.weekXp : 0,
          p_total_xp: state.xp, p_level: levelOf(state.xp) + 1, p_school: schoolCode()
        });
        BE.status = ''; BE.boardAt = 0; BE.schoolAt = 0; BE.classesAt = 0;
        break;
      } catch (e) {
        if (attempt === 0 && /zu schnell/.test(String(e && e.message))) { await wait(3500); continue; }
        BE.status = 'Dein Punktestand konnte gerade nicht an die Klasse gesendet werden.';
        break;
      }
    }
  } finally {
    BE.pushing = false;
    if (BE.pushAgain) { BE.pushAgain = false; pushProgress(); }
  }
  paintBoard();
}

  if (!BE.client || !state.classCode || BE.loading) return;

  try {

function openExplain() {

/* ---------- Lernstand als verschlüsselter QR-Code ---------- */
const qrAvailable = () => !!(CFG.teacherKey && window.qrcode && window.crypto && window.crypto.subtle);
function lernstandPayload() {
  const wkNow = Math.floor((dayIdx() + 3) / 7);
  return {
    v: 1, tp: TOPIC.id, i: Math.floor(Date.now() / 1000), id: LQ.randomId(8),
    n: state.nick, r: (state.realName || '').trim(), k: state.classCode || '',
    x: state.xp, w: state.weekKey === wkNow ? state.weekXp : 0, l: levelOf(state.xp) + 1, ro: state.rounds, st: streakNow(),
    s: STATIONS.map(st => (state.stars[st.id] === undefined ? '-' : String(state.stars[st.id]))).join(''),
    ls: STATIONS.map(st => (state.lessons[st.id] ? '1' : '0')).join(''),
    ch: Object.keys(state.challenges).slice(-3).map(k => [k, state.challenges[k].c, state.challenges[k].t])
  };
}
async function showQr() {
  ui.screen = 'qr'; ui.qr = { state: 'loading' };
  render();
  try {
    const token = await LQ.encrypt(CFG.teacherKey, lernstandPayload());
    const q = window.qrcode(0, 'M'); q.addData(token); q.make();
    ui.qr = { state: 'ok', svg: q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }), until: Date.now() + 600000 };
  } catch (e) { ui.qr = { state: 'err' }; }
  if (ui.screen === 'qr') render('keep');
}
function qrCard() {
  if (!qrAvailable()) return '';
  return `<article class="card qrc" style="--i:9">
      <div class="tag">Mein Lernstand</div>
      <h3>QR-Code für die Lehrperson</h3>
      <p class="small">Dein Punktestand wird verschlüsselt in einen QR-Code gepackt. Nur die Prüf-App deiner Lehrperson kann ihn lesen. Es wird nichts hochgeladen.</p>
      <div class="ansrow chrow"><input id="realname" class="numin txtin" type="text" autocomplete="off" maxlength="30" placeholder="Dein Name (freiwillig)" value="${esc(state.realName || '')}" aria-label="Dein Name für die Lehrperson"></div>
      <p class="small">Der Name steht nur im verschlüsselten Code, nirgends sonst.</p>
      <button class="btn btn-primary block" data-act="showqr">QR-Code anzeigen</button>
    </article>`;
}
function viewQr() {
  const q = ui.qr || { state: 'loading' };
  const body = q.state === 'ok' ? `<div class="qrbox" id="qrbox" role="img" aria-label="QR-Code mit deinem verschlüsselten Lernstand">${q.svg}</div><p class="countdown">Gültig noch <b class="mono" id="qrleft">10:00</b></p>`
    : q.state === 'err' ? '<p class="errtxt" role="alert">Der Code konnte nicht erzeugt werden. Dein Browser unterstützt die Verschlüsselung vielleicht nicht.</p>' : '<p class="small">Code wird erzeugt …</p>';
  return `
  <main class="wrap qrscreen">
    <section class="card">
      <div class="tag">Mein Lernstand</div>
      <h2 class="sumh">QR-Code</h2>
      ${body}
      <p class="small">Zeige den Code deiner Lehrperson. Er ist verschlüsselt: Nur die Prüf-App deiner Lehrperson kann ihn lesen. Es wird nichts hochgeladen. Wenn der Code abläuft, erzeugst du einfach einen neuen.</p>
    </section>
    <button class="btn btn-primary block" data-act="showqr">Neuen Code erzeugen</button>
    <button class="btn block" data-act="home">Zurück</button>
  </main>`;
}

/* ---------- Lektion ---------- */
let L = null;
function startLesson(id) {
  const st = STATIONS.find(s => s.id === id);
  L = { st, i: 0, dir: 1, shown: {}, sel: {}, wk: {}, fromRound: false };
  ui.screen = 'lesson'; ui.formulas = false;
  render();
}
function lessonGo(d) {
  const n = L.st.lesson.length;
  L.i = Math.max(0, Math.min(n - 1, L.i + d)); L.dir = d;
  render();
}
function finishLesson() {
  const id = L.st.id, first = !state.lessons[id], lvB = levelOf(state.xp);
  let gain = 0;
  if (first) { state.lessons[id] = true; gain = 15; bumpXp(gain); touchStreak(); save(); pushProgress(); }
  L.gain = gain; L.levelUp = levelOf(state.xp) > lvB;
  L.newTrophies = checkTrophies(); save();
  ui.screen = 'lessondone';
  render();
}

/* ---------- Challenge ---------- */
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9\-]/g, '').slice(0, 20);
function startChallenge() {
  const el = $id('chcode');
  const code = normCode(el ? el.value : ui.chCode);
  ui.chCode = code;
  if (code.length < 3) { ui.chErr = 'Der Code braucht mindestens 3 Zeichen, zum Beispiel 4-FUNKE.'; render('keep'); return; }
  ui.chErr = '';
  startRound('challenge', code);
}

/* ---------- Animationen ---------- */
function countUp(el, to, pre, suf) {
  tween(0, to, 900, v => { el.textContent = pre + Math.round(v) + suf; });
}
function confetti(host) {
  if (!host || reduced()) return;
  const cols = ['var(--pop-yellow)', 'var(--pop-pink)', 'var(--pop-cyan)', 'var(--pop-green)', 'var(--primary)'];
  const box = document.createElement('div');
  box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 44; i++) {
    const s = document.createElement('span');
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 140;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', (Math.sin(a) * d - 60) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random() * 120) + 'ms';
    box.appendChild(s);
  }
  host.appendChild(box);
  setTimeout(() => { if (box.parentNode) box.parentNode.removeChild(box); }, 1700);
}

/* ---------- Ansichten ---------- */
function viewHome() {
  const lv = levelOf(state.xp);
  const cur = LEVELS[lv], nxt = LEVELS[lv + 1];
  const pct = nxt ? Math.round((state.xp - cur.xp) / (nxt.xp - cur.xp) * 100) : 100;
  const sn = streakNow();
  const diff = state.lastDay === null ? null : dayIdx() - state.lastDay;
  let streakNote = 'Eine Runde pro Tag hält deine Serie am Laufen. Ein freier Tag ist erlaubt.';
  if (sn > 0 && diff >= 1) streakNote = diff === 1 ? 'Mach heute eine Runde, dann läuft deine Serie weiter.' : 'Letzte Chance: Mach heute eine Runde, sonst startet die Serie neu.';

    .map(p => `<span class="spark" aria-hidden="true" style="--x:${p[0]};--y:${p[1]};--s:${p[2]};--c:${p[3]};--t:${p[4]}"></span>`).join('');
  const cards = STATIONS.map((s, idx) => {
    const open = true;
    const canPractice = stationUnlocked(s) || !!state.lessons[s.id];
    const stars = state.stars[s.id];
    const done = stars !== undefined;
    const learned = !!state.lessons[s.id];
    const mcount = s.items.filter(mastered).length;

    return `<article class="card st${open ? '' : ' locked'}" style="--i:${idx};${scStyle(s.nr)}">
      <div class="num mono" aria-hidden="true">${s.nr}</div>
      <div class="stbody">

        ${open ? `<div class="mast" role="img" aria-label="${mcount} von ${s.items.length} Aufgabentypen sicher">${segs}</div>

        : `<p class="small">Schliesse Station ${s.nr - 1} mit mindestens einem Stern ab, um diese freizuschalten.</p>`}
      </div>
      ${open ? `<div class="acts"><button class="btn ${learned ? '' : 'btn-primary'}${nudge === 'learn:' + s.id ? ' nudge' : ''}" data-act="learn" data-st="${s.id}">Lernen</button><button class="btn ${learned && !done ? 'btn-primary' : ''}${nudge === 'start:' + s.id ? ' nudge' : ''}" data-act="start" data-st="${s.id}" ${canPractice ? '' : 'disabled'}>Üben</button></div>` : ''}
    </article>`;
  }).join('');

  const rev = reviewPool().length ? `<article class="card review" style="--i:6">
      <div class="stbody">
        <h3>Auffrischen</h3>
        <p class="small">${due > 0 ? `${due} Aufgabentypen sind zum Wiederholen fällig. Gemischte Runde aus allen Stationen, die du schon gespielt hast.` : 'Gerade ist nichts fällig. Aufgaben kommen nach ein paar Tagen automatisch zurück.'}</p>
      </div>
      <button class="btn ${due > 0 ? 'btn-primary' : ''}" data-act="review">Runde starten</button>
    </article>` : '';

  const chKeys = Object.keys(state.challenges).slice(-3).reverse();
  const chal = `<article class="card chal" style="--i:8">
      <div class="tag">Challenge und Duell</div>
      <h3>Gleiche Fragen, fairer Vergleich</h3>
      <p class="small">Alle mit demselben Code bekommen dieselben 6 Fragen. Deine Lehrperson kann einen Code an die Tafel schreiben, oder du forderst jemanden heraus. Eine Ziffer vorne (zum Beispiel 3-ABCD) beschränkt die Fragen auf die Stationen 1 bis 3.</p>
      <div class="ansrow chrow"><input id="chcode" class="numin mono" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="z. B. 4-FUNKE" value="${esc(ui.chCode || '')}" aria-label="Challenge-Code"><button class="btn" data-act="rcode">Zufall</button></div>
      ${ui.chErr ? `<p class="errtxt" role="alert">${ui.chErr}</p>` : ''}
      <button class="btn btn-primary block" data-act="challenge">Challenge starten</button>
      <p class="small nickrow">Dein Zufallsname: <span class="mono b">${state.nick}</span> <button class="btn sm" data-act="nick">Neu würfeln</button></p>
      ${chKeys.length ? `<ul class="chlist">${chKeys.map(k => `<li><span class="mono">${esc(k)}</span>: ${state.challenges[k].c} von 6 in ${state.challenges[k].t} s</li>`).join('')}</ul>` : ''}
    </article>`;

  const initW = ui.anim ? 0 : pct;
  return `
  <header class="top">
    ${sparks}
    <div class="topbar">
      <div class="logochip"><img src="logo.png" alt="Sekundarschule Halingen"></div>

      <button class="wbtn" data-act="poke" aria-label="Watti anstupsen">${watti(pct, 'happy', 'big')}</button></div>

      <div class="stat"><span class="k">Serie</span><span class="v mono">${sn} ${sn === 1 ? 'Tag' : 'Tage'}</span><span class="mono s">Schonfrist 1 Tag</span></div>
    </div>
    <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Fortschritt zur nächsten Stufe"><div data-w="${pct}" style="width:${initW}%"></div></div>
  </header>
  <main class="wrap">
    <p class="small streaknote">${streakNote}</p>
    ${trophyBar()}
    <div class="row"><h2>Dein Lernpfad</h2><button class="btn sm" data-act="formulas">${ui.formulas ? CARD + ' zu' : CARD}</button></div>
    ${ui.formulas ? formulaCard() : ''}
    ${state.introDone ? '' : introCard()}
    <div class="path">${cards}${rev}${classCard()}${qrCard()}${chal}</div>
    <footer class="foot">
      ${'weeklyGoalPerPlayer' in CFG ? `<p class="small"><a href="lernapp.html">Alle Kapitel</a> \u00B7 <a href="index.html">Lernlandkarte</a>${TOPIC.other ? ` \u00B7 Weitere App: <a href="${TOPIC.other.href}">${TOPIC.other.title}</a>` : ''}</p>` : ''}
      <p class="small">Dein Fortschritt wird nur auf diesem Gerät im Browser gespeichert${memoryOnly ? ' (Speichern ist hier gerade nicht möglich, der Fortschritt geht beim Schliessen verloren)' : ''}. Der Zufallsname ist nirgends sonst hinterlegt.</p>
      <button class="btn sm" data-act="reset">${ui.confirmReset ? 'Sicher? Nochmals tippen zum Löschen' : 'Fortschritt zurücksetzen'}</button>

}

function viewRound() {
  const q = R.queue[R.i], d = q.d;
  const last = R.i === R.queue.length - 1;
  const pct = Math.round(R.i / R.queue.length * 100);
  const label = R.mode === 'review' ? 'Auffrischen' : R.mode === 'challenge' ? 'Challenge \u00B7 ' + R.code : `Station ${R.st.nr} \u00B7 ${R.st.title}`;
  let body = '';
  if (d.type === 'mc') {
    body = `<div class="opts" role="group" aria-label="Antworten">` + d.shown.map((o, i) => {
      let cls = 'opt';
      if (q.done) { if (o.ok) cls += ' good'; else if (q.sel === i) cls += ' bad'; }
      return `<button class="${cls}" style="--i:${i}" data-act="opt" data-i="${i}" ${q.done ? 'disabled' : ''}><span class="ltr mono" aria-hidden="true">${'ABCD'[i]}</span><span>${o.t}</span></button>`;
    }).join('') + `</div>`;
  } else {
    const err = q.fb && (q.fb.kind === 'warn' || q.fb.kind === 'bad') ? ' err' : '';
    body = `<label class="sr" for="ans">Deine Antwort in ${d.unit}</label>
      <div class="ansrow"><input id="ans" class="numin mono${err}" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Zahl" value="${esc(q.input)}" ${q.done ? 'disabled' : ''}><span class="unitl mono">${d.unit}</span></div>
      <p class="small">Dezimalzahlen mit Komma oder Punkt.</p>
      ${q.done ? '' : `<button class="btn btn-primary block" data-act="check">${q.attempts ? 'Nochmals prüfen' : 'Prüfen'}</button>`}`;
  }
  const canExplain = q.fb && (q.fb.kind === 'bad' || q.fb.kind === 'warn') && q.fb.title !== 'Gib eine Zahl ein.' && R.mode !== 'challenge' && q.tpl.learn;
  const fb = q.fb ? `<div class="fb ${q.fb.kind}" role="status" aria-live="polite">${q.fb.xp ? `<span class="xppop">+${q.fb.xp} XP</span>` : ''}<div class="fbt">${q.fb.title}</div><div class="fbb">${q.fb.body}</div>${canExplain ? '<button class="btn sm fbx" data-act="explain">Erklärung ansehen</button>' : ''}</div>` : '';
  const mood = !q.fb ? 'happy' : q.fb.kind === 'good' ? 'cheer' : q.fb.kind === 'bad' ? 'sad' : 'think';
  const nxt = q.done ? `<button class="btn btn-primary block" data-act="next">${last ? 'Ergebnis ansehen' : 'Weiter'}</button>` : '';
  return `
  <main class="wrap round">
    <div class="rtop">
      <button class="btn sm" data-act="quit">Beenden</button>
      <span class="mono small">Frage ${Math.min(R.i + 1, R.queue.length)} von ${R.queue.length}</span>
      ${TOPIC.audio ? `<button class="btn sm" id="tbtn" data-act="tonaus">${state.audioOff ? 'Ton aus' : 'Ton an'}</button>` : ''}
      <button class="btn sm" data-act="formulas">${ui.formulas ? CARD + ' zu' : CARD}</button>
    </div>
    <div class="xpbar light" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Fortschritt in dieser Runde"><div style="width:${pct}%"></div></div>
    ${ui.formulas ? formulaCard() : ''}
    <section class="card qcard" style="${R.st ? scStyle(R.st.nr) : '--sc:var(--primary)'}">
      ${watti(pct, mood, 'mini')}
      <div class="tags"><span class="tag">${label}</span>${d.type === 'num' && q.tpl.ext ? '<span class="badge">Erweiterung</span>' : ''}${q.retry ? '<span class="badge warn">Zweiter Anlauf</span>' : ''}${R.mode === 'challenge' ? '<span class="badge warn">Zeit läuft, 1 Versuch</span>' : ''}</div>
      <h2 class="q">${d.q}</h2>

    </section>
    ${fb}

}

    : 'Runde beendet.';

    const wt = document.querySelector('.hero .watti');

  }

    const ol = document.querySelector('.wsteps'), hid = ol && ol.querySelector('li.hid');

    if (ol && !ol.querySelector('li.hid')) { b.disabled = true; b.textContent = 'Das war es'; }
  }
  else if (a === 'explain') openExplain();
  else if (a === 'backround') { ui.screen = 'round'; render('keep'); window.scrollTo(0, 0); }
  else if (a === 'showqr') showQr();

  else if (a === 'check') checkNum();
  else if (a === 'next') nextQ();
  else if (a === 'home') { ui.screen = 'home'; ui.formulas = false; render(); }
  else if (a === 'trophies') { checkTrophies(); TROPHIES.forEach(t => { if (state.trophies[t.id]) state.trophySeen[t.id] = true; }); save(); ui.screen = 'trophies'; render(); }
  else if (a === 'quit') { ui.screen = 'home'; ui.formulas = false; R = null; render(); }
  else if (a === 'formulas') {
    if (R && ui.screen === 'round') { const el = $id('ans'); if (el) R.queue[R.i].input = el.value; }

}
// Tippen zuverlässig machen: Touch-Geräte lösen manchmal keinen Klick aus (iPhone-Safari)
let touchPos = null, lastTouchAct = 0;
document.addEventListener('touchstart', e => { const t = e.touches && e.touches[0]; touchPos = t ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
document.addEventListener('touchend', e => {
  const t = e.changedTouches && e.changedTouches[0];
  if (!touchPos || !t) return;
  const moved = Math.abs(t.clientX - touchPos.x) + Math.abs(t.clientY - touchPos.y); touchPos = null;
  if (moved > 10) return;                                   // Wischen zum Scrollen zählt nicht als Tippen
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  e.preventDefault(); lastTouchAct = Date.now(); onAct(b);
}, { passive: false });
document.addEventListener('click', e => {
  if (Date.now() - lastTouchAct < 700) return;             // schon über Touch behandelt
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  onAct(b);
});
document.addEventListener('input', e => {
  if (!e.target) return;
  if (e.target.id === 'chcode') ui.chCode = e.target.value;

  else if (e.target.id === 'chcode') { e.preventDefault(); startChallenge(); }
  else if (e.target.id === 'clscode') { e.preventDefault(); joinClass(); }
});
